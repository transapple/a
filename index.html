   The single source of truth for pending SQL migrations. The school app
   never shows SQL to schools anymore — when a feature needs a migration, a
   row goes here (via addDatabaseUpdate, typically called by whoever is
   building the feature) and a mother admin copies/runs it, then marks it
   Applied or Failed from the Database Updates screen. */
async function listDatabaseUpdates() {
  return sb(`/rest/v1/database_updates?${qs({select:"*", order:"created_at.desc"})}`);
}
async function addDatabaseUpdate(title, sqlCode, description) {
  assertFullAccess();
  const res = await sb(`/rest/v1/database_updates`, { method:"POST", body: JSON.stringify({ title, sql_code: sqlCode, description: description || null, status: "pending" }) });
  logAudit("add_database_update", "database_update", null, title);
  return res;
}
async function markDatabaseUpdateApplied(id) {
  assertFullAccess();
  const res = await sb(`/rest/v1/database_updates?id=eq.${id}`, { method:"PATCH", body: JSON.stringify({ status: "applied", applied_at: new Date().toISOString(), error_message: null }) });
  logAudit("apply_database_update", "database_update", id, null);
  return res;
}
async function markDatabaseUpdateFailed(id, errorMessage) {
  assertFullAccess();
  const res = await sb(`/rest/v1/database_updates?id=eq.${id}`, { method:"PATCH", body: JSON.stringify({ status: "failed", error_message: errorMessage || null }) });
  logAudit("fail_database_update", "database_update", id, errorMessage);
  return res;
}
async function resetDatabaseUpdateToPending(id) {
  assertFullAccess();
  const res = await sb(`/rest/v1/database_updates?id=eq.${id}`, { method:"PATCH", body: JSON.stringify({ status: "pending", error_message: null, applied_at: null }) });
  logAudit("retry_database_update", "database_update", id, null);
  return res;
}
// Runs the migration server-side via the guarded run_database_update() RPC
// instead of a manual copy/paste into Supabase. Requires the signed-in
// admin's own password as proof (never stored — passed straight through to
// the RPC call and discarded) and full-access role; the function itself
// re-checks both server-side. Returns the updated row either way — a
// caught SQL error comes back as status:"failed" + error_message rather
// than throwing, so the card can just be re-rendered from the result.
async function runDatabaseUpdate(id, password) {
  assertFullAccess();
  if (!motherAdmin) throw new Error("Not signed in.");
  if (!password) throw new Error("Enter your password to run this automatically.");
  const rows = await sb(`/rest/v1/rpc/run_database_update`, { method:"POST", body: JSON.stringify({
    p_actor_username: motherAdmin.username, p_actor_password: password, p_update_id: id,
  }) });
  return Array.isArray(rows) ? rows[0] : rows;
}
async function deleteDatabaseUpdate(id) {
  assertFullAccess();
  const res = await sb(`/rest/v1/database_updates?id=eq.${id}`, { method:"DELETE" });
  logAudit("delete_database_update", "database_update", id, null);
  return res;
}

/* ---------------- RISK & RETENTION ----------------
   Per-school engagement (for the "going quiet" list) and real Web Push
   subscribe/unsubscribe for this device. The scheduled server-side check
   that actually *sends* pushes lives outside this file — see the Edge
   Function code and setup steps surfaced in the Risk & Retention tab. */
async function listSchoolEngagement() {

}
function daysSince(dateStr) {
  if (!dateStr) return null;
  return Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
}
async function countRecentErrors(minutes) {
  const since = new Date(Date.now() - minutes*60000).toISOString();
  return countRows("platform_error_log", { created_at:`gte.${since}` });
}

// Converts the VAPID public key (base64url, no padding) into the Uint8Array
// the PushManager API expects.
function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
async function getExistingPushSubscription() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return null;
  const reg = await navigator.serviceWorker.ready;
  return reg.pushManager.getSubscription();
}
async function subscribeToPush() {
  const reg = await navigator.serviceWorker.ready;
  const permission = await Notification.requestPermission();
  if (permission !== "granted") throw new Error("Notification permission was not granted.");
  const sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
  });
  const json = sub.toJSON();
  await sb(`/rest/v1/push_subscriptions`, { method:"POST", headers:{ "Prefer":"resolution=merge-duplicates" }, body: JSON.stringify({
    endpoint: json.endpoint, p256dh: json.keys.p256dh, auth: json.keys.auth,
  }) });
  return sub;
}
async function unsubscribeFromPush() {
  const sub = await getExistingPushSubscription();
  if (!sub) return;
  const endpoint = sub.endpoint;
  await sub.unsubscribe();
  try { await sb(`/rest/v1/push_subscriptions?endpoint=eq.${encodeURIComponent(endpoint)}`, { method:"DELETE" }); } catch(e) {}
}
// Manually invokes the Edge Function that checks conditions and sends
// pushes, instead of waiting for its schedule — used by the "Check now"
// button so an admin can confirm everything's wired up correctly.
async function runRiskCheckNow() {
  const res = await fetch(RISK_CHECK_FUNCTION_URL, {
    method: "POST",
    headers: { "Authorization": "Bearer " + SUPABASE_KEY, "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
  });
  let data = null;
  try { data = await res.json(); } catch(e) {}
  if (!res.ok) throw new Error((data && data.error) || `Check failed (${res.status}). Has the Edge Function been deployed?`);
  return data;
}

async function loadSchools() {
  const listEl = document.getElementById("schoolList");
  const pendingCard = document.getElementById("pendingCard");
  const pendingList = document.getElementById("pendingList");
  const exportBtn = document.getElementById("exportCsvBtn");
  const searchInput = document.getElementById("schoolSearchInput");
  if (searchInput) {
    searchInput.oninput = () => { schoolSearchTerm = searchInput.value; renderSchoolsTableOnly(); };
  }
  const importBtn = document.getElementById("importCsvBtn");
  const importFile = document.getElementById("importCsvFile");
  if (importBtn && importFile) {
    importBtn.onclick = () => { if (isFullAccess()) importFile.click(); else alert("Read-only accounts can't import schools."); };
    importFile.onchange = async () => {
      const file = importFile.files[0];
      importFile.value = "";
      if (!file) return;
      const text = await file.text();
      try { await importSchoolsCSV(text); loadSchools(); }
      catch(e) { alert(e.message); }
    };
  }
  purgeExpiredTrashedSchools(); // fire-and-forget: finalizes any school whose 30-day Trash window already passed
  try {
    const allSchools = await listSchools();
    if (exportBtn) exportBtn.onclick = () => exportSchoolsCSV(allSchools.filter(s => !s.deleted_at));
    if (!allSchools.length) { listEl.innerHTML = `<div class="tiny-note">No schools registered yet.</div>`; if (pendingCard) pendingCard.style.display = "none"; if (document.getElementById("rejectedCard")) document.getElementById("rejectedCard").style.display = "none"; return; }

    // Trashed schools never appear on Home (Pending/Rejected/Schools) — they
    // live on their own dedicated Trash page instead, with no restore
    // option (see SCHOOL_TRASH_SQL and renderTrash()).
    const schools = allSchools.filter(s => !s.deleted_at);
    if (!schools.length) { listEl.innerHTML = `<div class="tiny-note">No schools registered yet.</div>`; if (pendingCard) pendingCard.style.display = "none"; if (document.getElementById("rejectedCard")) document.getElementById("rejectedCard").style.display = "none"; return; }

    const pending = schools.filter(s => s.status === "pending");
    if (pendingCard && pendingList) {
      if (pending.length) {
        pendingCard.style.display = "";
        pendingList.innerHTML = pending.map(s => `
          <div class="school-row">
            <div class="row" style="gap:10px;">
              ${schoolLogoHtml(s)}
              <div>
                <div class="school-name">${s.name}</div>
                <div class="tiny-note">${[s.motto, schoolLocationLabel(s)].filter(Boolean).join(" · ") || "Self-registered · " + new Date(s.created_at).toLocaleString()}</div>
                <div class="tiny-note">${s.first_admin ? `<span style="display:inline-flex;align-items:center;gap:6px;vertical-align:middle;">${adminAvatarHtml(s.first_admin, 20)} Created by ${s.first_admin.full_name}${s.first_admin.username ? " (@"+s.first_admin.username+")" : ""}</span>` : "No administrator account found"}</div>
              </div>
            </div>
            <div class="row">
              <button class="btn btn-primary btn-sm" data-approve="${s.id}">Approve</button>
              <button class="btn btn-danger btn-sm" data-reject="${s.id}">Reject</button>
            </div>
          </div>`).join("");
        pendingList.querySelectorAll("[data-approve]").forEach(btn => {
          btn.onclick = async (e) => {
            e.stopPropagation();
            try { await approveSchool(btn.dataset.approve); loadSchools(); }
            catch(err) { alert(err.message); }
          };
        });
        pendingList.querySelectorAll("[data-reject]").forEach(btn => {
          btn.onclick = async (e) => {
            e.stopPropagation();
            if (!confirm("Reject this school? It will move to the Rejected list below, where you can restore it or delete it completely later.")) return;
            try { await rejectSchool(btn.dataset.reject); loadSchools(); }
            catch(err) { alert(err.message); }
          };
        });
      } else { pendingCard.style.display = "none"; }
    }

    const rejectedCard = document.getElementById("rejectedCard");
    const rejectedList = document.getElementById("rejectedList");
    const rejected = schools.filter(s => s.status === "rejected");
    if (rejectedCard && rejectedList) {
      if (rejected.length) {
        rejectedCard.style.display = "";
        rejectedList.innerHTML = rejected.map(s => `
          <div class="school-row">
            <div class="row" style="gap:10px;">
              ${schoolLogoHtml(s)}
              <div>
                <div class="school-name">${s.name}</div>
                <div class="tiny-note">${[s.motto, schoolLocationLabel(s)].filter(Boolean).join(" · ") || "Self-registered · " + new Date(s.created_at).toLocaleString()}</div>
                <div class="tiny-note">${s.first_admin ? `<span style="display:inline-flex;align-items:center;gap:6px;vertical-align:middle;">${adminAvatarHtml(s.first_admin, 20)} Created by ${s.first_admin.full_name}${s.first_admin.username ? " (@"+s.first_admin.username+")" : ""}</span>` : "No administrator account found"}</div>
              </div>
            </div>
            <div class="row">
              <button class="btn btn-primary btn-sm" data-restore="${s.id}">Restore</button>
              <button class="btn btn-ghost btn-sm" data-manage="${s.id}">Manage</button>
            </div>
          </div>`).join("");
        rejectedList.querySelectorAll("[data-restore]").forEach(btn => {
          btn.onclick = async (e) => {
            e.stopPropagation();
            if (!confirm("Restore this school to Pending approval?")) return;
            try { await restoreSchool(btn.dataset.restore); loadSchools(); }
            catch(err) { alert(err.message); }
          };
        });
        rejectedList.querySelectorAll("[data-manage]").forEach(btn => {
          btn.onclick = (e) => {
            e.stopPropagation();
            currentSchoolId = btn.dataset.manage; schoolSubTab = "danger"; view = "schoolDetail"; render();
          };
        });
      } else { rejectedCard.style.display = "none"; }
    }

    lastApprovedSchools = schools.filter(s => s.status !== "pending" && s.status !== "rejected");
    renderSchoolsTableOnly();
  } catch(e) {
    listEl.innerHTML = `<div class="err">${e.message}</div>`;
  }
}

let lastApprovedSchools = []; // cache of the last-loaded approved-schools list, so the search box can re-filter without a refetch
function renderSchoolsTableOnly() {
  const listEl = document.getElementById("schoolList");
  if (!listEl) return;
  if (!lastApprovedSchools.length) { listEl.innerHTML = `<div class="tiny-note">No approved schools yet.</div>`; return; }
  const term = schoolSearchTerm.trim().toLowerCase();
  const rest = term ? lastApprovedSchools.filter(s => {
    const a = s.first_admin;
    const haystack = [s.name, a?.full_name, a?.username, a?.phone, a?.email, a?.whatsapp].filter(Boolean).join(" ").toLowerCase();
    return haystack.includes(term);
  }) : lastApprovedSchools;
  if (!rest.length) { listEl.innerHTML = `<div class="tiny-note">No schools match "${schoolSearchTerm}".</div>`; return; }
  const restIds = new Set(rest.map(s => s.id));
  Array.from(selectedSchoolIds).forEach(id => { if (!restIds.has(id)) selectedSchoolIds.delete(id); });
  const sizeLabel = (s) => s.size_range || "—";
  const adminContact = (s) => {
    const a = s.first_admin;
    if (!a) return "—";
    const bits = [a.username ? "@"+a.username : null, a.phone, a.email].filter(Boolean);
    return bits.length ? bits.join(" · ") : "—";
  };
  listEl.innerHTML = `<div class="table-scroll"><table class="mini-table schools-table">
    <thead><tr>
      <th></th>
      <th>Logo</th>
      <th class="name-cell">School Name</th>
      <th>Location</th>
      <th>Size</th>
      <th class="name-cell">First Administrator</th>
      <th class="contact-cell">Administrator Contact</th>
      <th>Status</th>
    </tr></thead>
    <tbody>
      ${rest.map(s => `
        <tr class="clickable" data-open="${s.id}">
          <td onclick="event.stopPropagation();"><input type="checkbox" class="schoolSelect" data-id="${s.id}" ${selectedSchoolIds.has(s.id)?'checked':''} style="width:16px;height:16px;" /></td>
          <td>${schoolLogoHtml(s)}</td>
          <td class="name-cell"><div class="school-name">${s.name}</div></td>
          <td>${schoolLocationLabel(s) || "—"}</td>
          <td>${sizeLabel(s)}</td>
          <td class="name-cell">${s.first_admin ? `<div class="row" style="align-items:center;gap:8px;">${adminAvatarHtml(s.first_admin, 28)}<span>${s.first_admin.full_name}</span></div>` : "—"}</td>
          <td class="contact-cell">${adminContact(s)}</td>
          <td>${statusBadge(s.status)}${s.status==='active' ? ` ${subscriptionBadge(s)}` : ""} ${schoolUpgradeBadge(s)}</td>
        </tr>`).join("")}
    </tbody>
  </table></div>`;
  listEl.querySelectorAll("[data-open]").forEach(row => {
    row.onclick = () => { currentSchoolId = row.dataset.open; schoolSubTab = "subscription"; view = "schoolDetail"; render(); };
  });
  listEl.querySelectorAll(".schoolSelect").forEach(cb => {
    cb.onclick = (e) => e.stopPropagation();
    cb.onchange = () => {
      if (cb.checked) selectedSchoolIds.add(cb.dataset.id); else selectedSchoolIds.delete(cb.dataset.id);
      updateBulkBar();
    };
  });
  updateBulkBar();

  const msgBtn = document.getElementById("bulkMessageBtn");
  const activateBtn = document.getElementById("bulkActivateBtn");
  const suspendBtn = document.getElementById("bulkSuspendBtn");
  if (msgBtn) msgBtn.onclick = () => {
    pendingAnnounceTargets = Array.from(selectedSchoolIds);
    view = "comms"; render();
  };
  if (activateBtn) activateBtn.onclick = async () => {
    if (!isFullAccess()) return;
    if (!confirm(`Activate ${selectedSchoolIds.size} selected school(s)?`)) return;
    await bulkSetSchoolStatus(Array.from(selectedSchoolIds), "active");
    selectedSchoolIds.clear(); loadSchools();
  };
  if (suspendBtn) suspendBtn.onclick = async () => {
    if (!isFullAccess()) return;
    if (!confirm(`Suspend ${selectedSchoolIds.size} selected school(s)? They'll lose access until reactivated.`)) return;
    await bulkSetSchoolStatus(Array.from(selectedSchoolIds), "suspended");
    selectedSchoolIds.clear(); loadSchools();
  };
}

/* ---------------- TRASH (its own page, off Home) ----------------
   Deleted schools used to sit in a card right on the Home/Schools screen;
   they now live here instead, one tap away via the "Trash" nav pill —
   Home only ever shows schools someone can still act on. Login is already
   blocked for everything in here the moment it's deleted; after 30 days
   purge_expired_trashed_schools() removes it (and all its data) for good,
   with no restore, same as before. */
async function renderTrash() {
  app().innerHTML = `
    <div class="wrap">
      ${topBarHtml()}
      ${navTabs("trash")}
      <div class="card">
        <div class="section-title" style="color:var(--red-dark);">Trash</div>
        <div class="tiny-note" style="margin-bottom:8px;">Deleted schools sit here for 30 days — login is already blocked for them — then they're permanently purged automatically, data and all. There is no restore.</div>
        <div id="trashList">Loading…</div>
      </div>
    </div>`;
  wireTopBar();
  wireNavTabs();
  loadTrash();
}
async function loadTrash() {
  const trashList = document.getElementById("trashList");
  purgeExpiredTrashedSchools(); // fire-and-forget: finalizes any school whose 30-day Trash window already passed
  try {
    const allSchools = await listSchools();
    const trashed = allSchools.filter(s => s.deleted_at);
    if (!trashed.length) { trashList.innerHTML = `<div class="tiny-note">Trash is empty.</div>`; return; }
    trashList.innerHTML = trashed.map(s => {
      const daysLeft = Math.max(0, 30 - Math.floor((Date.now() - new Date(s.deleted_at).getTime()) / 86400000));
      return `
      <div class="school-row">
        <div class="row" style="gap:10px;">
          ${schoolLogoHtml(s)}
          <div>
            <div class="school-name">${s.name}</div>
            <div class="tiny-note">Deleted ${new Date(s.deleted_at).toLocaleDateString()}${s.deleted_by ? ` by ${s.deleted_by}` : ""}</div>
            <div class="tiny-note" style="color:var(--red-dark);font-weight:700;">${daysLeft > 0 ? `Permanently deleted in ${daysLeft} day${daysLeft===1?"":"s"} — no restore` : "Being permanently deleted — no restore"}</div>
          </div>
        </div>
      </div>`;
    }).join("");
  } catch(e) {
    trashList.innerHTML = `<div class="err">${e.message}</div>`;
  }
}

// Exactly these four categories — no "Custom" plan tier. A school's modules
// can still be hand-toggled from the Features tab regardless of which of
// these four plans it's on, so a separate "Custom" plan name isn't needed.
const PLAN_OPTIONS = ["Trial","Basic","Standard","Premium"];
const PLAN_DESCRIPTIONS = {
  Trial:    "Free — basic features for evaluation.",
  Basic:    "Paid — essential school management features.",
  Standard: "Paid — extended features with additional capabilities.",
  Premium:  "Paid — full access to all modules and features.",
};
const CYCLE_OPTIONS = [["monthly","Monthly"],["termly","Termly"],["yearly","Yearly"]];
const METHOD_OPTIONS = [["cash","Cash"],["bank","Bank transfer"],["mobile_money","Mobile Money"],["cheque","Cheque"],["other","Other"]];

/* ---------------- FEATURE / MODULE CONTROL ----------------
   These ids must match the GATABLE_NAV_IDS list in the school app exactly —
   they're the sections a school sees in its sidebar/bottom nav. Home,
   Account, Settings and Trash are never listed here: they're core to every
   school's own account and can't be switched off from here.
   One exception: "parent_portal" isn't a nav tab in the staff-side school
   app at all — it gates the entire separate parent-facing app shell. It
   uses the exact same schools.features jsonb column and on/off mechanics,
   just checked at a different point in the school app's code.
   schools.features is a jsonb map like {"fees": true, "exams": false, ...}.
   A school app treats a missing key as "on", so an empty/unset features
   column (the default for every existing school) changes nothing until a
   mother admin actually opens this panel and saves. */
const FEATURE_MODULES = [
  { id: "health",         label: "School Health" },
  { id: "students",       label: "Students" },
  { id: "teachers",       label: "Staff" },
  { id: "attendance",     label: "Attendance" },
  { id: "fees",           label: "Fees" },
  { id: "exams",          label: "Exams" },
  { id: "academic",       label: "Setup (terms/classes/subjects)" },
  { id: "comms",          label: "Comms (announcements/meetings)" },
  { id: "inventory",      label: "Inventory & Assets" },
  { id: "library",        label: "Library" },
  { id: "parent_portal",  label: "Parent Portal" },
];
// What a fresh plan turns on by default. Each tier is a strict superset of
// the one below it, so Premium is the only plan with every module on — as
// described in the plan list. Applying defaults always produces a
// FULLY-SPECIFIED map (every module id set true or false), so the school app
// never has to guess — only truly unconfigured schools (features still `{}`)
// fall back to "everything on". An admin can still hand-toggle any module
// afterward regardless of plan — these are just starting points.
const PLAN_FEATURE_DEFAULTS = {
  // Trial (Free): just enough to evaluate the core workflow — enrollment,
  // staff records, attendance. No Parent Portal on a free trial.
  Trial:    { students:true, teachers:true, attendance:true, health:false, fees:false, exams:false, academic:false, comms:false, inventory:false, library:false, parent_portal:false },
  // Basic (Paid): adds the day-to-day essentials — fees, term/class setup,
  // parent comms. Parent Portal is held back for Standard+ (it's the module
  // most likely to drive an upgrade once a school sees it in the demo).
  Basic:    { students:true, teachers:true, attendance:true, health:false, fees:true,  exams:false, academic:true,  comms:true,  inventory:false, library:false, parent_portal:false },
  // Standard (Paid): adds exams/report cards on top of Basic, plus Parent Portal.
  Standard: { students:true, teachers:true, attendance:true, health:false, fees:true,  exams:true,  academic:true,  comms:true,  inventory:true,  library:true,  parent_portal:true  },
  // Premium (Paid): full access to every module, including School Health and Parent Portal.
  Premium:  { students:true, teachers:true, attendance:true, health:true,  fees:true,  exams:true,  academic:true,  comms:true,  inventory:true,  library:true,  parent_portal:true  },
};
function planDefaultFeatures(plan) {
  return PLAN_FEATURE_DEFAULTS[plan] || null; // null for an unrecognized/no plan — caller decides fallback
}

function statusActionsHtml(s) {
  if (s.status === "pending") return `
    <button class="btn btn-primary" data-action="approve">Approve school</button>
    <button class="btn btn-danger" data-action="reject">Reject</button>`;
  if (s.status === "rejected") return `
    <button class="btn btn-primary" data-action="restore">Restore to pending</button>
    <button class="btn btn-danger" data-action="delete">Delete completely</button>`;
  // Suspend and Deactivate are independent toggles, not a shared "Reactivate":
  // each button reflects and flips just its own half of the status, so an
  // admin can tell at a glance which state a school is in and undo just that.
  const isSuspended = s.status === "suspended";
  const isDeactivated = s.status === "deactivated";
  return `
    <button class="btn ${isSuspended ? 'btn-primary' : 'btn-ghost'}" data-action="toggle-suspend">${isSuspended ? "Unsuspend" : "Suspend"}</button>
    <button class="btn ${isDeactivated ? 'btn-primary' : 'btn-ghost'}" data-action="toggle-deactivate">${isDeactivated ? "Activate" : "Deactivate"}</button>
    <button class="btn btn-danger" data-action="delete">Delete</button>`;
}

async function renderSchoolDetail() {
  app().innerHTML = `<div class="wrap">${topBarHtml()}<div class="tiny-note">Loading…</div></div>`;
  wireTopBar();
  let s;
  try { s = await getSchool(currentSchoolId); }
  catch(e) { app().innerHTML = `<div class="wrap"><div class="err">${e.message}</div></div>`; return; }
  if (!s) { app().innerHTML = `<div class="wrap"><div class="err">School not found.</div></div>`; return; }

  app().innerHTML = `
    <div class="wrap">
      ${topBarHtml()}
      <div class="back-link" id="backBtn">‹ Back to schools</div>
      <div class="card">
        <div class="row" style="justify-content:space-between;align-items:flex-start;">
          <div class="row" style="align-items:flex-start;gap:12px;">
            ${schoolLogoHtml(s, "lg")}
            <div>
              <div class="school-name" style="font-size:17px;">${s.name}</div>
              ${s.school_code ? `<div class="tiny-note" style="font-family:monospace;font-weight:700;">School ID: ${s.school_code}</div>` : ""}
              <div class="tiny-note">${[s.motto, schoolLocationLabel(s), s.size_range].filter(Boolean).join(" · ") || "No profile details yet"}</div>
              <div class="tiny-note">Registered ${new Date(s.created_at).toLocaleString()}${s.approved_at ? " · Approved " + new Date(s.approved_at).toLocaleString() : ""}</div>
              <div class="tiny-note">${s.first_admin ? `<span style="display:inline-flex;align-items:center;gap:6px;vertical-align:middle;">${adminAvatarHtml(s.first_admin, 22)} Created by <strong>${s.first_admin.full_name}</strong>${s.first_admin.username ? ` (@${s.first_admin.username})` : ""}${[s.first_admin.phone, s.first_admin.email, s.first_admin.whatsapp].filter(Boolean).length ? " · " + [s.first_admin.phone, s.first_admin.email, s.first_admin.whatsapp].filter(Boolean).join(" · ") : ""}</span>` : "No administrator account found for this school"}</div>
            </div>
          </div>
          <div>${statusBadge(s.status)}</div>
        </div>
        <div id="statusMsg"></div>
        <div class="row" style="flex-wrap:wrap;margin-top:12px;">${statusActionsHtml(s)}</div>
      </div>

      <div class="card" id="onboardingCard" style="display:none;">
        <div class="section-title">Getting this school set up</div>
        <div id="onboardingChecklist" class="tiny-note">Checking…</div>
      </div>

      ${subTabsHtml(SCHOOL_TABS, schoolSubTab, "schooltab")}
      <div id="schoolTabContent"></div>
    </div>`;

  document.getElementById("backBtn").onclick = () => { view = "dashboard"; render(); };
  renderOnboardingChecklist(s);
  wireTopBar();
  wireSubTabs("schooltab", (id) => { schoolSubTab = id; render(); });

  // Status actions (approve / reject / suspend-toggle / deactivate-toggle / delete) —
  // always visible above the tabs since they apply to the whole school record.
  app().querySelectorAll("[data-action]").forEach(btn => {
    btn.onclick = async () => {
      const action = btn.dataset.action;
      const msg = document.getElementById("statusMsg"); msg.innerHTML = "";
      try {
        if (action === "approve") { await approveSchool(s.id); }
        else if (action === "reject") {
          await rejectSchool(s.id);
        } else if (action === "restore") {
          await restoreSchool(s.id);
        } else if (action === "delete") {
          // Deleting a school that has ANY data (even a self-registered
          // school's first admin account) fails as a plain row delete, since
          // every school-scoped table references schools(id) — that's what
          // the Danger Zone's "Delete school completely" does properly,
          // wiping the data first. Send them there instead of failing here.
          schoolDangerNotice = `To delete "${s.name}", use "Delete school completely" below — it safely clears the school's data first.`;
          schoolSubTab = "danger";
          render();
          return;
        } else if (action === "toggle-suspend") {
          await setSchoolStatus(s.id, s.status === "suspended" ? "active" : "suspended");
        } else if (action === "toggle-deactivate") {
          if (s.status === "deactivated") { await setSchoolStatus(s.id, "active"); }
          else {
            if (!confirm("Deactivate this school? Its accounts will no longer be able to log in.")) return;
            await setSchoolStatus(s.id, "deactivated");
          }
        }
        renderSchoolDetail();
      } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
    };
  });

  if (schoolSubTab === "features") renderSchoolFeaturesTab(s);
  else if (schoolSubTab === "admins") renderSchoolAdminsTab(s);
  else if (schoolSubTab === "activity") renderSchoolActivityTab(s);
  else if (schoolSubTab === "contact") renderSchoolContactTab(s);
  else if (schoolSubTab === "format") renderSchoolFormatTab(s);
  else if (schoolSubTab === "danger") renderSchoolDangerTab(s);
  else renderSchoolSubscriptionTab(s);
}

// Lightweight setup checklist so a newly-approved school doesn't quietly sit
// half-configured — surfaces the handful of things worth doing right after
// approval (plan, first payment, admin, features, profile). Purely derived
// from data already on the school record / already-fetched payments, no new
// table needed. Once everything's done the card just disappears — nothing
// to dismiss, nothing left nagging on a school that's fully set up.
async function renderOnboardingChecklist(s) {
  const card = document.getElementById("onboardingCard");
  const el = document.getElementById("onboardingChecklist");
  if (!card || !el) return;
  let hasPayment = false;
  try { hasPayment = (await listPayments(s.id)).length > 0; } catch (e) {}
  const items = [
    { done: !!s.plan, label: "Set a subscription plan", goto: "subscription" },
    { done: hasPayment, label: "Record the first payment", goto: "subscription" },
    { done: !!s.first_admin, label: "Confirm a school administrator account exists", goto: "admins" },
    { done: !!(s.features && Object.keys(s.features).length), label: "Review feature modules for this plan", goto: "features" },
    { done: !!(s.motto || schoolLocationLabel(s) || s.logo_url), label: "Fill in school profile (logo, motto, location)", goto: "format" },
  ];
  const remaining = items.filter(i => !i.done);
  if (!remaining.length) { card.style.display = "none"; return; }
  card.style.display = "";
  el.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:6px;">
      ${items.map(i => `
        <div class="row" style="justify-content:space-between;gap:8px;">
          <span style="${i.done ? 'text-decoration:line-through;color:var(--ink-soft);' : ''}">${i.done ? '✓' : '○'} ${i.label}</span>
          ${!i.done ? `<button class="btn btn-ghost btn-sm" data-onb-goto="${i.goto}">Go</button>` : ""}
        </div>`).join("")}
    </div>
    <div class="tiny-note" style="margin-top:8px;">${remaining.length} of ${items.length} left. This card disappears once everything's checked off.</div>`;
  el.querySelectorAll("[data-onb-goto]").forEach(btn => {
    btn.onclick = () => { schoolSubTab = btn.dataset.onbGoto; render(); };
  });
}

async function loadSchoolActivity(schoolId) {
  const statsEl = document.getElementById("activityStatsCard");
  const listEl = document.getElementById("schoolActivityList");
  try {
    schoolActivityItems = await listSchoolLoginLog(schoolId, 500);
    const successes = schoolActivityItems.filter(r => r.success);
    const failures = schoolActivityItems.filter(r => !r.success);
    const uniqueUsers = new Set(successes.map(r => r.username)).size;
    const last7 = successes.filter(r => (Date.now() - new Date(r.created_at).getTime()) < 7*86400000).length;
    const lastLogin = successes[0]; // newest-first
    statsEl.innerHTML = `
      <div class="section-title">Login summary</div>
      <div class="grid2">
        <div><div style="font-size:22px;font-weight:800;">${successes.length}</div><div class="subtle">Successful logins</div></div>
        <div><div style="font-size:22px;font-weight:800;">${failures.length}</div><div class="subtle">Failed attempts</div></div>
        <div><div style="font-size:22px;font-weight:800;">${uniqueUsers}</div><div class="subtle">Distinct accounts logged in</div></div>
        <div><div style="font-size:22px;font-weight:800;">${last7}</div><div class="subtle">Logins, last 7 days</div></div>
      </div>
      <div class="tiny-note" style="margin-top:8px;">${lastLogin ? `Last successful login: <strong>${lastLogin.username}</strong> · ${new Date(lastLogin.created_at).toLocaleString()}` : "No successful logins recorded yet."}</div>`;
    renderSchoolActivityList(schoolId);
  } catch(e) {
    statsEl.innerHTML = `<div class="err">${e.message}</div>`;
    if (listEl) listEl.innerHTML = "";
  }
}

function renderSchoolActivityList(schoolId) {
  const el = document.getElementById("schoolActivityList");
  if (!schoolActivityItems.length) { el.innerHTML = `<div class="empty">No login activity recorded yet.</div>`; return; }
  const now = Date.now();
  const recentFailuresByUser = {};
  schoolActivityItems.forEach(r => {
    if (!r.success && (now - new Date(r.created_at).getTime()) < 15*60000) {
      recentFailuresByUser[r.username] = (recentFailuresByUser[r.username]||0) + 1;
    }
  });
  const shown = schoolActivityShowAll ? schoolActivityItems : schoolActivityItems.slice(0, LOG_PAGE_SIZE);
  el.innerHTML = `
    <div class="table-scroll"><table class="mini-table"><thead><tr><th>When</th><th>Username</th><th>Result</th></tr></thead><tbody>
      ${shown.map(r => `<tr>
        <td>${new Date(r.created_at).toLocaleString()}</td>
        <td>${r.username}${recentFailuresByUser[r.username] >= 3 ? ' <span class="badge badge-suspended">Suspicious</span>' : ''}</td>
        <td>${r.success ? '<span class="badge badge-active">Success</span>' : '<span class="badge badge-suspended">Failed</span>'}</td>
      </tr>`).join("")}
    </tbody></table></div>
    <div class="table-foot">
      <span>${schoolActivityItems.length > LOG_PAGE_SIZE ? `<span class="link-btn" id="schoolActivityToggle">${schoolActivityShowAll ? "Show latest 10" : `Show all (${schoolActivityItems.length})`}</span>` : ""}</span>
      ${isFullAccess() ? `<button class="btn btn-danger btn-sm" id="clearSchoolActivityBtn">Clear this school's log</button>` : ""}
    </div>
    <div id="schoolActivityMsg"></div>`;
  const toggle = document.getElementById("schoolActivityToggle");
  if (toggle) toggle.onclick = () => { schoolActivityShowAll = !schoolActivityShowAll; renderSchoolActivityList(schoolId); };
  const clearBtn = document.getElementById("clearSchoolActivityBtn");
  if (clearBtn) clearBtn.onclick = async () => {
    if (!confirm("Clear all login activity for this school? This can't be undone.")) return;
    const msg = document.getElementById("schoolActivityMsg");
    try {
      await clearSchoolLoginLog(schoolId);
      schoolActivityShowAll = false;
      loadSchoolActivity(schoolId);
    } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
  };
}

async function loadPaymentHistory(schoolId, schoolName) {

    el.innerHTML = `<table class="mini-table"><thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Note</th><th></th></tr></thead><tbody>
      ${payments.map(p => `<tr>

    el.querySelectorAll("[data-receipt]").forEach(btn => {

// Simple plain-text receipt generated entirely client-side from the payment
// row already on screen — no invoice numbering/PDF layout, just something
// concrete you can hand a school as proof of payment right after recording it.
function downloadPaymentReceipt(schoolName, p) {
  const lines = [
    "TransApple Technologies — Payment Receipt",
    "".padEnd(42, "-"),
    `School: ${schoolName}`,
    `Date: ${new Date(p.created_at).toLocaleString()}`,
    `Amount received: ${p.amount}`,
    `Method: ${(p.method||'—').replace('_',' ')}`,
    p.note ? `Note: ${p.note}` : null,
    `Receipt ref: ${p.id}`,
    "".padEnd(42, "-"),
    "This receipt was generated from the TransApple mother admin app.",
  ].filter(Boolean).join("\n");
  const blob = new Blob([lines], { type: "text/plain;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `receipt-${schoolName.replace(/[^a-z0-9]+/gi,'-')}-${p.id}.txt`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

        <div class="admin-row">
          <div>

        </div>`).join("");

          const form = document.getElementById(`resetForm-${btn.dataset.reset}`);
          form.style.display = form.style.display === "none" ? "block" : "none";
        };
      });
      listEl.querySelectorAll("[data-confirmReset]").forEach(btn => {

          const pw = document.getElementById(`resetPw-${id}`).value;
          const msg = document.getElementById("adminMsg"); msg.innerHTML = "";

          } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }

          if (!confirm("Revoke this account's administrator privileges?")) return;

          try {
            await setAdminPrivilege(schoolId, btn.dataset.revoke, false);
            msg.innerHTML = `<div class="msg-ok">Admin privileges revoked.</div>`;
            loadAdmins(schoolId);
          } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
        };
      });
    }
    const staff = await listNonAdminStaff(schoolId);
    if (!staff.length) { grantSelect.innerHTML = `<option value="">No other staff accounts</option>`; grantSelect.disabled = true; }
    else {
      grantSelect.disabled = false;
      grantSelect.innerHTML = `<option value="">Select a staff member…</option>` + staff.map(p => `<option value="${p.id}">${p.full_name} (@${p.username})</option>`).join("");
    }
    document.getElementById("grantBtn").onclick = async () => {
      const id = grantSelect.value;
      const msg = document.getElementById("adminMsg"); msg.innerHTML = "";
      if (!id) { msg.innerHTML = `<div class="err">Select a staff member first.</div>`; return; }
      try {
        await setAdminPrivilege(schoolId, id, true);
        msg.innerHTML = `<div class="msg-ok">Admin privileges granted.</div>`;
        loadAdmins(schoolId);
      } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
    };
  } catch(e) {
    listEl.innerHTML = `<div class="err">${e.message}</div>`;
  }
}

      <div class="section-title">Push alerts to this device</div>
      ${!supported ? `<div class="tiny-note">This browser doesn't support push notifications.</div>` : `
        <div class="row" style="justify-content:space-between;">
          <span class="badge ${sub ? 'badge-active' : 'badge-deactivated'}">${sub ? 'Subscribed' : 'Not subscribed'}</span>
          <button class="btn btn-sm ${sub ? 'btn-ghost' : 'btn-primary'}" id="pushToggleBtn">${sub ? 'Unsubscribe' : 'Enable push alerts'}</button>
        </div>
        <div class="tiny-note" style="margin-top:8px;">When enabled, this device gets a push notification whenever the scheduled check finds a school going quiet, a payment overdue, or an error spike. Needs the database setup in Settings → Database, plus a scheduled Edge Function, to actually fire.</div>
        <div class="row" style="margin-top:10px;">
          <button class="btn btn-ghost btn-sm" id="riskCheckNowBtn">Check now</button>
        </div>
        <div id="pushMsg"></div>`}
    `;
    const toggleBtn = document.getElementById("pushToggleBtn");
    if (toggleBtn) toggleBtn.onclick = async () => {
      const msg = document.getElementById("pushMsg"); if (msg) msg.innerHTML = "";
      toggleBtn.disabled = true;
      try {
        if (sub) await unsubscribeFromPush(); else await subscribeToPush();
        await renderPushCard();
      } catch(e) { toggleBtn.disabled = false; if (msg) msg.innerHTML = `<div class="err">${e.message}</div>`; }
    };
    const checkBtn = document.getElementById("riskCheckNowBtn");
    if (checkBtn) checkBtn.onclick = async () => {
      const msg = document.getElementById("pushMsg"); msg.innerHTML = "";
      checkBtn.disabled = true; checkBtn.textContent = "Checking…";
      try {
        const result = await runRiskCheckNow();
        msg.innerHTML = `<div class="msg-ok">Checked. ${result && typeof result.alerts_sent === "number" ? `${result.alerts_sent} alert(s) sent.` : "See Edge Function logs for details."}</div>`;
      } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
      checkBtn.disabled = false; checkBtn.textContent = "Check now";
    };
  }
  await renderPushCard();

  const alertsCard = document.getElementById("alertsCard");
  const engagementCard = document.getElementById("engagementCard");
  try {
    const [engagement, recentErrors] = await Promise.all([
      listSchoolEngagement(),
      countRecentErrors(60),
    ]);
    const today = new Date().toISOString().slice(0,10);
    const overdue = engagement.filter(s => s.status === "active" && s.subscription_expires_at && s.subscription_expires_at < today);
    const goingQuiet30 = engagement.filter(s => s.status === "active" && daysSince(s.last_login_at) !== null && daysSince(s.last_login_at) >= 30);
    const errorSpike = recentErrors >= 15;

    alertsCard.innerHTML = `
      <div class="section-title">Needs attention</div>
      ${(!overdue.length && !goingQuiet30.length && !errorSpike) ? `<div class="tiny-note">Nothing needs attention right now.</div>` : `
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${overdue.map(s => `<div class="row" style="justify-content:space-between;"><span><span class="badge badge-suspended">Payment</span> ${s.name} — subscription expired ${new Date(s.subscription_expires_at).toLocaleDateString()}</span></div>`).join("")}
          ${goingQuiet30.map(s => `<div class="row" style="justify-content:space-between;"><span><span class="badge badge-warn">Inactive</span> ${s.name} — no logins in ${daysSince(s.last_login_at)}d</span></div>`).join("")}
          ${errorSpike ? `<div class="row" style="justify-content:space-between;"><span><span class="badge badge-suspended">Errors</span> ${recentErrors} errors reported in the last hour</span></div>` : ""}
        </div>`}
      <div class="tiny-note" style="margin-top:10px;">This card refreshes when you open the tab. The push alerts above (once set up) reach you even when you don't have the app open.</div>`;
  } catch(e) {
    alertsCard.innerHTML = `<div class="section-title">Needs attention</div><div class="err">${e.message}</div><div class="tiny-note" style="margin-top:6px;">Run Step 1 below if this table/view doesn't exist yet.</div>`;
  }

  try {
    const engagement = await listSchoolEngagement();
    const rows = engagement.filter(s => s.status === "active");
    engagementCard.innerHTML = `
      <div class="section-title">Per-school engagement</div>
      <div class="tiny-note" style="margin-bottom:8px;">Sorted least-recently-active first, so schools going quiet surface at the top.</div>
      ${rows.length ? `
        <div class="table-scroll"><table class="mini-table"><thead><tr><th>School</th><th>Last login</th><th>Active users (7d)</th><th>Status</th></tr></thead><tbody>
          ${rows.map(s => {
            const d = daysSince(s.last_login_at);
            let riskBadge;
            if (d === null) riskBadge = `<span class="badge badge-suspended">Never logged in</span>`;
            else if (d >= 30) riskBadge = `<span class="badge badge-suspended">At risk (${d}d)</span>`;
            else if (d >= 14) riskBadge = `<span class="badge badge-warn">Going quiet (${d}d)</span>`;
            else riskBadge = `<span class="badge badge-active">Active</span>`;
            return `<tr><td>${s.name}</td><td>${s.last_login_at ? new Date(s.last_login_at).toLocaleString() : '—'}</td><td>${s.active_users_7d}</td><td>${riskBadge}</td></tr>`;
          }).join("")}
        </tbody></table></div>
      ` : `<div class="empty">No active schools yet.</div>`}`;
  } catch(e) {
    engagementCard.innerHTML = `<div class="section-title">Per-school engagement</div><div class="err">${e.message}</div>`;
  }
}

  const elc = document.getElementById("supportList");

      const ageBadge = r.status === "open" && ageDays !== null ? `<span class="badge ${ageDays >= 3 ? 'badge-suspended' : 'badge-deactivated'}">${ageDays === 0 ? 'today' : ageDays + 'd open'}</span>` : "";

      <div class="admin-row" style="flex-direction:column;align-items:stretch;">

          </div>
          <div style="display:flex;gap:6px;align-items:center;">
            ${r.status==='open' ? `<button class="btn btn-ghost btn-sm" data-resolve="${r.id}">Mark resolved</button>` : ""}
            <span class="tiny-note">View thread ▾</span>
          </div>
        </div>
        <div id="thread-${r.id}" style="display:none;margin-top:10px;border-top:1px solid var(--line, #e4e8ef);padding-top:10px;">
          <div id="threadMsgs-${r.id}" class="tiny-note">Loading…</div>
          <div style="display:flex;gap:6px;margin-top:8px;">
            <input id="threadReply-${r.id}" placeholder="Write a reply…" style="flex:1;" />
            <button class="btn btn-primary btn-sm" data-reply="${r.id}">Send</button>
          </div>
        </div>
      </div>`;
    }).join("");
    elc.querySelectorAll("[data-resolve]").forEach(btn => {
      btn.onclick = async (e) => { e.stopPropagation(); await resolveSupportRequest(btn.dataset.resolve); loadSupportRequests(); };
    });
    elc.querySelectorAll("[data-toggle]").forEach(row => {
      row.onclick = async () => {
        const id = row.dataset.toggle;
        const panel = document.getElementById(`thread-${id}`);
        const isOpen = panel.style.display !== "none";
        if (isOpen) { panel.style.display = "none"; return; }
        panel.style.display = "block";
        const msgsEl = document.getElementById(`threadMsgs-${id}`);
        try {
          const msgs = await listSupportThread(id);
          msgsEl.innerHTML = msgs.length ? msgs.map(m => `
            <div style="margin-bottom:6px;"><b>${m.sender==='transapple' ? (m.sender_name||'TransApple') : (m.sender_name||'School')}</b>
            <span class="tiny-note">· ${new Date(m.created_at).toLocaleString()}</span><br/>${m.message}</div>`).join("")
            : `<div class="tiny-note">No messages yet.</div>`;
        } catch(e) { msgsEl.innerHTML = `<div class="err">${e.message}</div>`; }
      };
    });
    elc.querySelectorAll("[data-reply]").forEach(btn => {
      btn.onclick = async (e) => {

        } catch(e) { alert(e.message); }

}

        <div class="tiny-note" style="margin-bottom:8px;">Full-access admins can register, suspend and delete schools and change other admins. Read-only admins can view every tab but nothing they do is saved.</div>
        <div id="secAdminMsg"></div>
        ${isFullAccess() ? `<div class="field"><label>Your password (to confirm any change below)</label><input id="secConfirmPw" type="password" /></div>` : ""}
        <div id="adminAccountsList" class="tiny-note">Loading…</div>
      </div>
      <div class="card">
        <div class="section-title">Login activity</div>
        <div class="tiny-note" style="margin-bottom:8px;">Recent attempts to log into this mother app. Repeated failures against one username are flagged as suspicious.</div>
        <div id="loginActivityList" class="tiny-note">Loading…</div>
      </div>
      <div class="card">
        <div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
          <div class="section-title" style="margin:0;">Audit log</div>
          <select id="auditActorFilter" style="max-width:200px;"><option value="">All admins</option></select>
        </div>
        <div class="tiny-note" style="margin:8px 0;">Every write made from this app, most recent first.</div>
        <div id="auditLogList" class="tiny-note">Loading…</div>
      </div>
      <div class="card">
        <div style="font-weight:800;margin-bottom:8px;">Database setup</div>
        <details><summary>Upgrade: admin roles, audit log &amp; login monitoring</summary>
          <p class="tiny-note">If this tab errors out, run this once in Supabase → SQL Editor.</p>
          <pre>${MOTHER_SECURITY_SQL}</pre>
        </details>
      </div>
    </div>`;
  wireTopBar();
  wireNavTabs();
  loadAdminAccounts();
  loadLoginActivity();
  loadAuditLogList();
}

async function loadAdminAccounts() {
  const el = document.getElementById("adminAccountsList");
  try {
    const admins = await listMotherAdmins();
    if (!admins.length) { el.innerHTML = `<div class="empty">No admin accounts found.</div>`; return; }
    el.innerHTML = admins.map(a => `
      <div class="admin-row">
        <div>
          <div style="font-weight:700;">${a.full_name || a.username} ${a.username===motherAdmin.username ? '<span class="tiny-note">(you)</span>' : ''}</div>
          <div class="tiny-note">@${a.username} · ${new Date(a.created_at).toLocaleString()}</div>
          <div style="margin-top:4px;">${roleBadge(a.role)} ${a.active ? '' : '<span class="badge badge-suspended">Deactivated</span>'}</div>
        </div>
        ${isFullAccess() && a.username !== motherAdmin.username ? `
        <div class="row" style="flex-wrap:wrap;justify-content:flex-end;">
          <button class="btn btn-ghost btn-sm" data-role="${a.id}" data-newrole="${a.role==='read_only'?'full_access':'read_only'}">${a.role==='read_only'?'Make full access':'Make read-only'}</button>
          <button class="btn ${a.active?'btn-danger':'btn-primary'} btn-sm" data-active="${a.id}" data-newactive="${a.active?'false':'true'}">${a.active?'Deactivate':'Reactivate'}</button>
        </div>` : ""}
      </div>`).join("");
    const doChange = async (id, newRole, newActive) => {
      const msg = document.getElementById("secAdminMsg"); msg.innerHTML = "";
      const pw = document.getElementById("secConfirmPw").value;
      try {
        if (!pw) throw new Error("Enter your password to confirm.");
        await setMotherAdminStatus(pw, id, newRole, newActive);
        document.getElementById("secConfirmPw").value = "";
        msg.innerHTML = `<div class="msg-ok">Updated.</div>`;
        loadAdminAccounts();
      } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
    };
    el.querySelectorAll("[data-role]").forEach(btn => {
      btn.onclick = () => doChange(btn.dataset.role, btn.dataset.newrole, undefined);
    });
    el.querySelectorAll("[data-active]").forEach(btn => {
      btn.onclick = () => {
        const activating = btn.dataset.newactive === "true";
        if (!activating && !confirm("Deactivate this admin? They won't be able to log in until reactivated.")) return;
        doChange(btn.dataset.active, undefined, activating);
      };
    });
  } catch(e) { el.innerHTML = `<div class="err">${e.message}</div>`; }
}

async function loadLoginActivity() {
  const el = document.getElementById("loginActivityList");
  try {
    loginActivityItems = await listLoginLog(500);
    renderLoginActivityList();
  } catch(e) { el.innerHTML = `<div class="err">${e.message}</div>`; }
}
function renderLoginActivityList() {
  const el = document.getElementById("loginActivityList");
  if (!loginActivityItems.length) { el.innerHTML = `<div class="empty">No login activity yet.</div>`; return; }
  // Flag a username as suspicious if it has 3+ failed attempts within the last 15 minutes.
  const now = Date.now();
  const recentFailuresByUser = {};
  loginActivityItems.forEach(r => {
    if (!r.success && (now - new Date(r.created_at).getTime()) < 15*60000) {
      recentFailuresByUser[r.username] = (recentFailuresByUser[r.username]||0) + 1;
    }
  });
  const shown = loginActivityShowAll ? loginActivityItems : loginActivityItems.slice(0, LOG_PAGE_SIZE);
  el.innerHTML = `
    <div class="table-scroll"><table class="mini-table"><thead><tr><th>When</th><th>Username</th><th>Result</th></tr></thead><tbody>
      ${shown.map(r => `<tr>
        <td>${new Date(r.created_at).toLocaleString()}</td>
        <td>${r.username}${recentFailuresByUser[r.username] >= 3 ? ' <span class="badge badge-suspended">Suspicious</span>' : ''}</td>
        <td>${r.success ? '<span class="badge badge-active">Success</span>' : '<span class="badge badge-suspended">Failed</span>'}</td>
      </tr>`).join("")}
    </tbody></table></div>
    <div class="table-foot">
      <span>${loginActivityItems.length > LOG_PAGE_SIZE ? `<span class="link-btn" id="loginActivityToggle">${loginActivityShowAll ? "Show latest 10" : `Show all (${loginActivityItems.length})`}</span>` : ""}</span>
      ${isFullAccess() ? `<button class="btn btn-danger btn-sm" id="clearLoginActivityBtn">Clear login activity</button>` : ""}
    </div>
    <div id="loginActivityMsg"></div>`;
  const toggle = document.getElementById("loginActivityToggle");
  if (toggle) toggle.onclick = () => { loginActivityShowAll = !loginActivityShowAll; renderLoginActivityList(); };
  const clearBtn = document.getElementById("clearLoginActivityBtn");
  if (clearBtn) clearBtn.onclick = async () => {
    if (!confirm("Clear all login activity? This can't be undone.")) return;
    const msg = document.getElementById("loginActivityMsg");
    try {
      await clearLoginLog();
      loginActivityShowAll = false;
      await loadLoginActivity();
    } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
  };
}

async function loadAuditLogList() {
  const el = document.getElementById("auditLogList");
  try {
    auditLogItems = await listAuditLog(500);
    const filterSelect = document.getElementById("auditActorFilter");
    if (filterSelect) {
      const actors = Array.from(new Set(auditLogItems.map(r => r.actor_username).filter(Boolean))).sort();
      filterSelect.innerHTML = `<option value="">All admins</option>` + actors.map(a => `<option value="${a}" ${a===auditLogActorFilter?'selected':''}>${a}</option>`).join("");
      filterSelect.value = auditLogActorFilter;
      filterSelect.onchange = () => { auditLogActorFilter = filterSelect.value; auditLogShowAll = false; renderAuditLogList(); };
    }
    renderAuditLogList();
  } catch(e) { el.innerHTML = `<div class="err">${e.message}</div>`; }
}
function renderAuditLogList() {
  const el = document.getElementById("auditLogList");
  const items = auditLogActorFilter ? auditLogItems.filter(r => r.actor_username === auditLogActorFilter) : auditLogItems;
  if (!items.length) { el.innerHTML = `<div class="empty">${auditLogActorFilter ? `No audit entries for @${auditLogActorFilter}.` : "No audit entries yet."}</div>`; return; }
  const shown = auditLogShowAll ? items : items.slice(0, LOG_PAGE_SIZE);
  el.innerHTML = `
    <div class="table-scroll"><table class="mini-table"><thead><tr><th>When</th><th>Admin</th><th>Action</th><th>Details</th></tr></thead><tbody>
      ${shown.map(r => `<tr>
        <td>${new Date(r.created_at).toLocaleString()}</td>
        <td>${r.actor_username || '—'}</td>
        <td>${r.action}${r.target_type ? ` (${r.target_type})` : ''}</td>
        <td>${r.details || ''}</td>
      </tr>`).join("")}
    </tbody></table></div>
    <div class="table-foot">
      <span>${items.length > LOG_PAGE_SIZE ? `<span class="link-btn" id="auditLogToggle">${auditLogShowAll ? "Show latest 10" : `Show all (${items.length})`}</span>` : ""}</span>
      ${isFullAccess() ? `<button class="btn btn-danger btn-sm" id="clearAuditLogBtn">Clear audit log</button>` : ""}
    </div>
    <div id="auditLogMsg"></div>`;
  const toggle = document.getElementById("auditLogToggle");
  if (toggle) toggle.onclick = () => { auditLogShowAll = !auditLogShowAll; renderAuditLogList(); };
  const clearBtn = document.getElementById("clearAuditLogBtn");
  if (clearBtn) clearBtn.onclick = async () => {
    if (!confirm("Clear the entire audit log? This can't be undone.")) return;
    const msg = document.getElementById("auditLogMsg");
    try {
      await clearAuditLog();
      auditLogShowAll = false;
      await loadAuditLogList();
    } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
  };
}

/* ---------------- DATABASE UPDATES ----------------
   The school app no longer shows any SQL/Supabase instructions to schools.
   Instead, every pending migration lives here: copy the SQL, run it in
   Supabase's SQL Editor, then mark it Applied (or Failed, with a note — it
   stays in the active list until it's re-run successfully). */
function dbUpdateStatusBadge(status) {
  if (status === "applied") return `<span class="badge badge-active">Applied</span>`;
  if (status === "failed") return `<span class="badge badge-suspended">Failed</span>`;
  return `<span class="badge badge-pending">Pending</span>`;
}
function dbUpdateCardHtml(u) {
  const created = new Date(u.created_at).toLocaleString();
  const appliedLine = u.status === "applied" && u.applied_at ? `<div class="tiny-note">Applied ${new Date(u.applied_at).toLocaleString()}</div>` : "";
  const errorLine = u.status === "failed" && u.error_message ? `<div class="err" style="margin-top:6px;">${u.error_message}</div>` : "";
  const retryBtn = u.status === "failed" ? `<button class="btn btn-sm" data-dbu-retry="${u.id}">Retry (reset to pending)</button>` : "";
  const actions = u.status === "applied"
    ? `<button class="btn btn-sm" data-dbu-delete="${u.id}">Remove from history</button>`
    : `<button class="btn btn-primary btn-sm" data-dbu-run="${u.id}">Run now</button>
       <button class="btn btn-sm" data-dbu-applied="${u.id}">Mark Applied</button>
       <button class="btn btn-sm" data-dbu-failed="${u.id}">Mark Failed</button>
       ${retryBtn}`;
  return `<div class="card" style="margin-bottom:10px;">
    <div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;">
      <div>
        <div style="font-weight:700;">${u.title} ${dbUpdateStatusBadge(u.status)}</div>
        <div class="tiny-note">Created ${created}</div>
        ${appliedLine}
      </div>
    </div>
    ${u.description ? `<p class="tiny-note" style="margin-top:8px;">${u.description}</p>` : ""}
    ${errorLine}
    <details style="margin-top:10px;" ${u.status === "applied" ? "" : "open"}><summary>SQL</summary>
      <pre style="margin-top:8px;" id="dbuSql-${u.id}">${u.sql_code}</pre>
      <button class="btn btn-sm" style="margin-top:8px;" data-dbu-copy="${u.id}">Copy SQL</button>
    </details>
    <div id="dbuCardMsg-${u.id}" style="margin-top:8px;"></div>
    <div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap;">${actions}</div>
  </div>`;
}
async function loadDatabaseUpdates() {
  const activeEl = document.getElementById("dbuActiveList");
  const appliedEl = document.getElementById("dbuAppliedList");
  if (!activeEl) return;
  activeEl.innerHTML = `<div class="tiny-note">Loading…</div>`;
  try {
    const rows = await listDatabaseUpdates();
    const active = rows.filter(r => r.status !== "applied");
    const applied = rows.filter(r => r.status === "applied");
    activeEl.innerHTML = active.length ? active.map(dbUpdateCardHtml).join("") : `<div class="empty">No pending database updates. You're all caught up.</div>`;
    appliedEl.innerHTML = applied.length ? applied.map(dbUpdateCardHtml).join("") : `<div class="empty">No applied updates yet.</div>`;
    wireDatabaseUpdateActions();
  } catch (e) {
    activeEl.innerHTML = `<div class="err">${e.message}</div>`;
    appliedEl.innerHTML = "";
  }
}
function wireDatabaseUpdateActions() {
  document.querySelectorAll("[data-dbu-copy]").forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.dbuCopy;
      const pre = document.getElementById(`dbuSql-${id}`);
      const text = pre ? pre.textContent : "";
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); ta.remove();
      }
      const original = btn.textContent;
      btn.textContent = "Copied!";
      setTimeout(() => { btn.textContent = original; }, 1500);
    };
  });
  document.querySelectorAll("[data-dbu-run]").forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.dbuRun;
      const msgEl = document.getElementById(`dbuCardMsg-${id}`);
      const pwField = document.getElementById("dbuRunPw");
      const password = pwField ? pwField.value : "";
      msgEl.innerHTML = "";
      if (!confirm("Run this SQL now against your live database? Only do this if you've reviewed it.")) return;
      btn.disabled = true; const original = btn.textContent; btn.textContent = "Running…";
      try {
        const result = await runDatabaseUpdate(id, password);
        if (result && result.status === "applied") {
          msgEl.innerHTML = `<div class="msg-ok">Applied successfully.</div>`;
        } else if (result && result.status === "failed") {
          msgEl.innerHTML = `<div class="err">${result.error_message || "The migration failed."}</div>`;
        }
        loadDatabaseUpdates();
      } catch (e) {
        btn.disabled = false; btn.textContent = original;
        msgEl.innerHTML = `<div class="err">${e.message}</div>`;
      }
    };
  });
  document.querySelectorAll("[data-dbu-applied]").forEach(btn => {
    btn.onclick = async () => {
      try { await markDatabaseUpdateApplied(btn.dataset.dbuApplied); loadDatabaseUpdates(); }
      catch (e) { alert(e.message); }
    };
  });
  document.querySelectorAll("[data-dbu-failed]").forEach(btn => {
    btn.onclick = async () => {
      const msg = prompt("What error did Supabase return? (shown on this update until it's re-run successfully)") || "";
      try { await markDatabaseUpdateFailed(btn.dataset.dbuFailed, msg); loadDatabaseUpdates(); }
      catch (e) { alert(e.message); }
    };
  });
  document.querySelectorAll("[data-dbu-delete]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Remove this applied update from history? This can't be undone.")) return;
      try { await deleteDatabaseUpdate(btn.dataset.dbuDelete); loadDatabaseUpdates(); }
      catch (e) { alert(e.message); }
    };
  });
  document.querySelectorAll("[data-dbu-retry]").forEach(btn => {
    btn.onclick = async () => {
      try { await resetDatabaseUpdateToPending(btn.dataset.dbuRetry); loadDatabaseUpdates(); }
      catch (e) { alert(e.message); }
    };
  });
}
function renderDatabaseUpdates() {
  app().innerHTML = `
    <div class="wrap">
      ${topBarHtml()}
      ${navTabs("dbupdates")}
      <div class="card">
        <div class="section-title">Add a database update</div>
        <div class="tiny-note" style="margin-bottom:8px;">Register a new SQL migration here whenever a feature needs one — it'll show up as Pending until you copy it into Supabase's SQL Editor and mark it Applied.</div>
        <div id="dbuAddMsg"></div>
        <div class="field"><label>Title</label><input id="dbuTitle" placeholder="e.g. Add attendance streaks table" /></div>
        <div class="field"><label>Description (optional)</label><input id="dbuDesc" placeholder="What this migration does and why" /></div>
        <div class="field"><label>SQL code</label><textarea id="dbuSqlInput" rows="6" placeholder="alter table ..."></textarea></div>
        <button class="btn btn-primary btn-sm" id="dbuAddBtn">Add update</button>
      </div>
      <div class="card">
        <div class="section-title">Pending &amp; failed</div>
        <div class="tiny-note" style="margin-bottom:8px;">Either copy the SQL and run it yourself in Supabase → SQL Editor, then mark it Applied — or enter your password below and tap "Run now" on an update to have it applied automatically. Only run things you've reviewed. Failed updates stay here — with the error shown — until they're re-run successfully.</div>
        <div class="field" style="max-width:320px;"><label>Your password (for Run now)</label><input id="dbuRunPw" type="password" placeholder="Required only for Run now" /></div>
        <div id="dbuActiveList" class="tiny-note">Loading…</div>
      </div>
      <div class="card">
        <div class="section-title">Applied (history)</div>
        <div id="dbuAppliedList" class="tiny-note">Loading…</div>
      </div>
    </div>`;
  wireTopBar();
  wireNavTabs();
  loadDatabaseUpdates();
  document.getElementById("dbuAddBtn").onclick = async () => {
    const msg = document.getElementById("dbuAddMsg"); msg.innerHTML = "";
    const title = document.getElementById("dbuTitle").value.trim();
    const desc = document.getElementById("dbuDesc").value.trim();
    const sqlCode = document.getElementById("dbuSqlInput").value.trim();
    try {
      if (!title) throw new Error("Enter a title.");
      if (!sqlCode) throw new Error("Enter the SQL code.");
      await addDatabaseUpdate(title, sqlCode, desc);
      document.getElementById("dbuTitle").value = "";
      document.getElementById("dbuDesc").value = "";
      document.getElementById("dbuSqlInput").value = "";
      loadDatabaseUpdates();
    } catch (e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
  };
}

function render() {
  if (!motherAdmin) { renderLogin(); return; }
  if (view === "settings") renderSettings();
  else if (view === "schoolDetail") renderSchoolDetail();
  else if (view === "analytics") renderAnalytics();
  else if (view === "risk") renderRisk();
  else if (view === "monitoring") renderMonitoring();
  else if (view === "comms") renderComms();
  else if (view === "updates") renderUpdates();
  else if (view === "security") renderSecurity();
  else if (view === "dbupdates") renderDatabaseUpdates();
  else if (view === "trash") renderTrash();
  else renderDashboard();
}
/* ---------------- Keyboard-aware form scrolling ----------------
   Every screen in this app is re-rendered via innerHTML, so fields are
   created/destroyed constantly — a single delegated listener on document
   covers all of them, present and future, instead of wiring each form. */
document.addEventListener("focusin", (e) => {
  const t = e.target;
  if (t.matches && t.matches("input, select, textarea")) {
    setTimeout(() => {
      t.scrollIntoView({ block: "center", behavior: "smooth" });
    }, 300); // gives the mobile keyboard time to finish animating in
  }
});

(async () => {
  // Not installed / not launched as an app → show the full-screen install
  // gate, with a "Continue in browser" button to skip installing.
  if (!isStandaloneDisplay() && !continuedInBrowser) {
    renderInstallGate();
    return;
  }
  // Installed & launched as an app → boot splash while the session restores,
  // then hand off to the normal app render.
  await tryRestoreMotherSession();
  purgeExpiredTrashedSchools(); // fire-and-forget: finalizes any school whose 30-day Trash window already passed
  render();
  const bootSplash = document.getElementById("bootSplash");
  if (bootSplash) bootSplash.classList.add("is-hidden");
})();
</script>
