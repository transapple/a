<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>TransApple Technologies</title>

<!-- ---- PWA: installability, icons & theme ---- -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#161A26">
<link rel="icon" type="image/png" href="https://i.postimg.cc/hvy7NPrV/20260729-202128.png">
<link rel="shortcut icon" href="https://i.postimg.cc/hvy7NPrV/20260729-202128.png">
<link rel="apple-touch-icon" href="https://i.postimg.cc/hvy7NPrV/20260729-202128.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root{
    /* Ink & neutrals */
    --navy:#161A26; --navy-2:#2A2F42; --ink:#1A1D27; --ink-soft:#666C7D;
    --slate:#8A90A0; --slate-tint:#EEF0F5; --line:#E4E7EE;
    --bg:#F2F3F7; --card:#FFFFFF; --surface-2:#F7F8FB;
    /* Accent (primary actions, active nav) — cool azure, distinct from status colors */
    --accent:#3457D5; --accent-dark:#28439E; --accent-tint:#EAEFFD;
    /* Status semantics */
    --teal:#1C9A6C; --teal-dark:#157A56; --teal-tint:#E3F6EC;
    --red:#D8433B; --red-dark:#B33831; --red-tint:#FCEAE9;
    --amber:#B8790F; --amber-tint:#FCF1DC;
    --radius:14px; --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(20,23,35,.04);
    --shadow-md:0 10px 28px -14px rgba(20,23,35,.22);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:720px;margin:0 auto;padding:calc(78px + env(safe-area-inset-top,0px)) 16px calc(86px + env(safe-area-inset-bottom,0px));}

  /* ---- Top bar / brand / account chip — fixed top bar ---- */
  .topbar{position:fixed;top:0;left:0;right:0;max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;background:var(--bg);box-shadow:0 6px 20px -14px rgba(20,23,35,.18);z-index:150;}
  .brand{font-weight:800;font-size:18px;letter-spacing:-.01em;color:var(--navy);}
  .brand span{color:var(--accent);}
  .acct-chip{display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 5px;box-shadow:var(--shadow-sm);transition:border-color .15s ease;}

  /* ---- Notification bell (top-right corner) ---- */
  .bell-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--navy);cursor:pointer;flex-shrink:0;box-shadow:var(--shadow-sm);}
  .bell-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .bell-badge{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;font-size:9.5px;font-weight:800;line-height:1;min-width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 3px;box-shadow:0 0 0 2px var(--bg);}
  .bell-panel{position:fixed;top:0;right:0;bottom:0;width:min(380px,100vw);background:#fff;box-shadow:-8px 0 30px rgba(20,23,35,.22);z-index:200;display:flex;flex-direction:column;animation:bellSlideIn .2s ease;}
  @keyframes bellSlideIn{from{transform:translateX(100%);}to{transform:translateX(0);}}
  .bell-panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line);}
  .bell-panel-body{flex:1;overflow-y:auto;padding:6px 14px 20px;}
  .bell-item{padding:11px 4px;border-bottom:1px solid var(--line);}
  .bell-item:last-child{border-bottom:none;}
  .bell-item .b-title{font-weight:700;font-size:13.5px;color:var(--navy);}
  .bell-item .b-body{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .bell-item .b-meta{font-size:11px;color:var(--ink-soft);margin-top:4px;}
  .bell-backdrop{position:fixed;inset:0;background:rgba(20,23,35,.35);z-index:190;}
  .acct-chip:hover{border-color:var(--accent);}
  .acct-avatar{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .acct-name{font-size:12.5px;font-weight:700;color:var(--navy-2);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---- Primary nav (workspace tabs) — fixed bottom bar ---- */
  .tabrail{position:fixed;left:0;right:0;bottom:0;display:flex;gap:2px;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));margin:0;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px -10px rgba(20,23,35,.18);z-index:100;-ms-overflow-style:none;scrollbar-width:none;}
  .tabrail::-webkit-scrollbar{display:none;}
  .tab-pill{flex:1 0 auto;min-width:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:transparent;color:var(--ink-soft);font-size:10.5px;font-weight:700;padding:7px 4px;border-radius:12px;cursor:pointer;white-space:nowrap;transition:all .15s ease;}
  .tab-pill:hover{color:var(--navy);}
  .tab-pill.is-active{background:var(--accent-tint);color:var(--accent-dark);}
  .tab-pill .icon svg{width:19px;height:19px;}

  /* ---- Secondary nav (within a school / settings) ---- */
  .subtabrail{display:flex;gap:6px;overflow-x:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:4px;margin-bottom:16px;-ms-overflow-style:none;scrollbar-width:none;}
  .subtabrail::-webkit-scrollbar{display:none;}
  .subtab-pill{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;border:none;background:transparent;color:var(--ink-soft);font-size:12.5px;font-weight:700;padding:9px 12px;border-radius:99px;cursor:pointer;white-space:nowrap;transition:all .15s ease;}
  .subtab-pill:hover{color:var(--navy);}
  .subtab-pill.is-active{background:var(--card);color:var(--accent-dark);box-shadow:var(--shadow-sm);}
  .subtab-pill.is-danger.is-active{color:var(--red-dark);}

  .icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;flex-shrink:0;}

  /* ---- Cards & structure ---- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow-sm);}
  .card-danger{border-color:#F0C7C3;background:linear-gradient(180deg,var(--red-tint),var(--card) 60px);}
  .section-title{font-weight:800;font-size:14.5px;margin-bottom:10px;letter-spacing:-.005em;}
  .subtle{color:var(--ink-soft);font-size:12.5px;}
  .tiny-note{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.5;}
  .divider{border:none;border-top:1px solid var(--line);margin:16px 0;}

  /* ---- Forms ---- */
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.02em;}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;background:var(--surface-2);color:var(--ink);transition:border-color .15s ease,background .15s ease;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);background:#fff;}
  .field textarea{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;resize:vertical;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  /* ---- Toggle switch (feature/module on-off) ---- */
  .toggle-switch{position:relative;display:inline-flex;align-items:center;width:42px;height:24px;flex-shrink:0;cursor:pointer;}
  .toggle-switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:2;}
  .toggle-slider{position:absolute;inset:0;background:var(--slate-tint);border:1px solid var(--line);border-radius:99px;transition:background .18s ease,border-color .18s ease;}
  .toggle-slider::before{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(20,23,35,.25);transition:transform .18s ease;}
  .toggle-switch input:checked + .toggle-slider{background:var(--teal);border-color:var(--teal-dark);}
  .toggle-switch input:checked + .toggle-slider::before{transform:translateX(18px);}
  .toggle-switch input:focus-visible + .toggle-slider{outline:2px solid var(--accent);outline-offset:2px;}
  .toggle-switch input:disabled + .toggle-slider{opacity:.5;cursor:not-allowed;}
  .toggle-row{display:flex;align-items:center;gap:9px;}
  .toggle-state{font-size:12.5px;color:var(--ink-soft);font-weight:700;min-width:54px;text-align:right;}

  /* ---- Buttons ---- */
  .btn{border:none;border-radius:var(--radius-sm);padding:11px 16px;font-size:13.5px;font-weight:700;cursor:pointer;transition:filter .15s ease,background .15s ease;}
  .btn:active{filter:brightness(0.94);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{background:var(--slate-tint);color:var(--navy-2);}
  .btn-ghost:hover{background:#E3E6EE;}
  .btn-danger{background:var(--red-tint);color:var(--red-dark);}
  .btn-danger:hover{background:#F9DBD9;}
  .btn-sm{padding:8px 12px;font-size:12px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .row{display:flex;gap:8px;align-items:center;}

  /* ---- Lists / rows ---- */
  .school-row{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);}
  .school-row:last-child{border-bottom:none;}
  .school-name{font-weight:700;color:var(--navy);}
  .school-logo{width:36px;height:36px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--accent-tint);color:var(--accent-dark);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .school-logo img{width:100%;height:100%;object-fit:cover;display:block;}
  .school-logo-lg{width:52px;height:52px;border-radius:14px;font-size:17px;}
  .clickable{cursor:pointer;border-radius:var(--radius-sm);}
  .clickable:hover{background:var(--surface-2);}
  .admin-row{display:flex;justify-content:space-between;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--line);gap:8px;}
  .admin-row:last-child{border-bottom:none;}
  .inline-form{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin-top:8px;}
  .empty{color:var(--ink-soft);font-size:13px;padding:10px 0;}

  /* ---- Badges ---- */
  .badge{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em;}
  .badge-active{background:var(--teal-tint);color:var(--teal-dark);}
  .badge-suspended{background:var(--red-tint);color:var(--red-dark);}
  .badge-pending{background:var(--amber-tint);color:var(--amber);}
  .badge-deactivated{background:var(--slate-tint);color:var(--slate);}
  .badge-warn{background:var(--amber-tint);color:var(--amber);}
  .badge-rejected{background:var(--red-tint);color:var(--red-dark);}

  /* ---- Tables ---- */
  .mini-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .mini-table th{text-align:left;color:var(--ink-soft);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;}
  .mini-table td{padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap;}
  .table-scroll{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch;margin:0 -2px;}
  .table-scroll .mini-table{min-width:480px;}
  .schools-table{min-width:840px;}
  .schools-table td, .schools-table th{vertical-align:middle;}
  .schools-table td.contact-cell, .schools-table th.contact-cell{white-space:normal;min-width:180px;}
  .schools-table td.name-cell, .schools-table th.name-cell{white-space:normal;min-width:150px;}
  .table-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;}

  /* ---- Nav / status links ---- */
  .back-link{color:var(--accent-dark);font-weight:700;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:4px;margin-bottom:12px;}
  .link-btn{color:var(--accent-dark);font-weight:700;cursor:pointer;}

  /* ---- Messages ---- */
  .err{background:var(--red-tint);color:var(--red-dark);padding:11px 13px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:12px;}
  .msg-ok{background:var(--teal-tint);color:var(--teal-dark);padding:11px 13px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:12px;}

  /* ---- Login ---- */
  .login-wrap{min-height:86vh;display:flex;align-items:center;justify-content:center;}
  .login-card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow-md);}

  /* ---- Misc ---- */
  details summary{cursor:pointer;font-weight:700;color:var(--navy-2);font-size:13px;padding:4px 0;}
  pre{background:var(--navy);color:#D7DCEA;border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px;font-size:11px;overflow-x:auto;white-space:pre-wrap;}
  hr.divider{border-top:1px solid var(--line);}

  /* ---- Brand logo (circular everywhere) ---- */
  .app-logo{border-radius:50%;object-fit:cover;display:block;flex-shrink:0;background:#fff;box-shadow:0 0 0 1px rgba(20,23,35,.06);}
  .topbar-logo{width:30px;height:30px;margin-right:2px;}
  .login-logo{width:64px;height:64px;margin:0 auto 14px;box-shadow:0 4px 16px -4px rgba(52,87,213,.35),0 0 0 1px rgba(20,23,35,.06);}

  /* ---- Boot splash (shown while the app initializes) ---- */
  #bootSplash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(180deg,var(--navy),var(--navy-2));transition:opacity .35s ease;}
  #bootSplash.is-hidden{opacity:0;pointer-events:none;}
  .splash-logo-wrap{position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center;}
  .splash-logo-wrap::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid rgba(255,255,255,.14);border-top-color:#fff;animation:splashSpin 1s linear infinite;}
  .splash-logo{width:96px;height:96px;box-shadow:0 8px 30px -6px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.12);animation:splashPulse 1.8s ease-in-out infinite;}
  .splash-brand{color:#fff;font-weight:800;font-size:16px;letter-spacing:-.01em;}
  .splash-brand span{color:#7C93F0;}
  .splash-sub{color:rgba(255,255,255,.55);font-size:12px;font-weight:600;letter-spacing:.02em;}
  @keyframes splashSpin{to{transform:rotate(360deg);}}
  @keyframes splashPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.045);}}

  /* ---- Full-screen install gate ---- */
  #installGate{position:fixed;inset:0;z-index:9998;display:none;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--navy),var(--navy-2));padding:24px;}
  .gate-card{width:100%;max-width:380px;text-align:center;color:#fff;}
  .gate-logo{width:104px;height:104px;margin:0 auto 20px;box-shadow:0 10px 34px -8px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.12);}
  .gate-title{font-weight:800;font-size:21px;letter-spacing:-.01em;margin-bottom:6px;}
  .gate-title span{color:#7C93F0;}
  .gate-desc{color:rgba(255,255,255,.65);font-size:13.5px;line-height:1.55;margin-bottom:22px;}
  .gate-btn{width:100%;border:none;border-radius:var(--radius-sm);padding:14px 16px;font-size:14.5px;font-weight:800;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 8px 20px -6px rgba(52,87,213,.55);transition:filter .15s ease;}
  .gate-btn:hover{filter:brightness(1.08);}
  .gate-btn:active{filter:brightness(.94);}
  .gate-btn-secondary{margin-top:10px;background:transparent;color:rgba(255,255,255,.65);box-shadow:none;border:1px solid rgba(255,255,255,.25);font-weight:600;}
  .gate-btn-secondary:hover{filter:none;background:rgba(255,255,255,.06);}
  .gate-btn-secondary:active{filter:none;background:rgba(255,255,255,.1);}
  .gate-instructions{margin-top:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius-sm);padding:14px 16px;text-align:left;color:rgba(255,255,255,.85);font-size:13px;line-height:1.7;}
  .gate-instructions b{color:#fff;}
  .gate-instructions ol{margin:6px 0 0;padding-left:18px;}
  .gate-waiting{margin-top:16px;color:rgba(255,255,255,.5);font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;}
  .gate-success{margin-top:6px;background:rgba(28,154,108,.18);border:1px solid rgba(28,154,108,.4);border-radius:var(--radius-sm);padding:14px 16px;color:#BFF0DA;font-size:13.5px;line-height:1.6;}
</style>
</head>

<div id="bootSplash">
  <div class="splash-logo-wrap"><img class="app-logo splash-logo" src="https://i.postimg.cc/hvy7NPrV/20260729-202128.png" alt="TransApple Technologies"></div>
  <div style="text-align:center;">
    <div class="splash-brand">TransApple <span>Technologies</span></div>
    <div class="splash-sub" style="margin-top:4px;">Loading…</div>
  </div>
</div>
<div id="installGate"></div>
<div id="app"></div>
<script>
/* ============================================================
   NOVA MOTHER APP
   Super-admin panel: register/suspend/manage every school that
   uses Nova School Manager. Uses the SAME Supabase project as the
   school app — schools are just rows in the `schools` table.
   ============================================================ */
const SUPABASE_URL = "https://jdayvizeqwfnknfdeudy.supabase.co";
const SUPABASE_KEY = "sb_publishable_NfJkiWiV3eGOTWrQrztTJA_xOeby6ae";

/* ---------------- RISK & RETENTION: PUSH ALERTS ----------------
   VAPID_PUBLIC_KEY is safe to ship in client code (that's how Web Push
   works — it's the public half of a key pair). The matching private key
   is a secret and only ever lives in the Edge Function's environment, never
   here. See the Risk & Retention tab for full setup instructions and the
   matching private key to use there.
   Generated once for this app — reuse it, don't regenerate, or existing
   subscriptions will silently stop receiving pushes. */
const VAPID_PUBLIC_KEY = "BN1vsx9nDlrhKcKHTHtTSFfj7Dpwbyc45d3JJwB0clU2NkP8RBkn95axxN4ETd9_47haCWHoebERdaU2oIFAf6I";
const RISK_CHECK_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/risk-alerts-check`;

/* ============================================================
   PWA: INSTALL-ONLY GATE
   The app only ever runs once it's been added/installed to the
   device — opened straight in a browser tab, it shows a full-screen
   "Install App" page with no way to skip past it. Once installed
   (standalone / home-screen launch), this gate never appears again
   until/unless the app is uninstalled.
   ============================================================ */
const APP_LOGO_URL = "https://i.postimg.cc/hvy7NPrV/20260729-202128.png";

function isStandaloneDisplay() {
  return window.matchMedia("(display-mode: standalone)").matches ||
         window.matchMedia("(display-mode: window-controls-overlay)").matches ||
         window.navigator.standalone === true; // iOS Safari's own flag
}

function detectPlatform() {
  const ua = navigator.userAgent || "";
  const isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isAndroid = /android/i.test(ua);
  const isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(ua);
  return { isIOS, isAndroid, isSafari };
}

let deferredInstallPrompt = null;
let continuedInBrowser = false; // set once the user taps "Continue in browser", so a later beforeinstallprompt doesn't yank them back to the gate mid-session

// Dismisses the install gate and boots the app normally, without installing.
async function continueInBrowserNow() {
  continuedInBrowser = true;
  const el = document.getElementById("installGate");
  el.style.display = "none";
  el.innerHTML = "";
  await tryRestoreMotherSession();
  purgeExpiredTrashedSchools(); // fire-and-forget: finalizes any school whose 30-day Trash window already passed
  render();
  const bootSplash = document.getElementById("bootSplash");
  if (bootSplash) bootSplash.classList.add("is-hidden");
}

function installInstructionsHtml() {
  const { isIOS, isAndroid, isSafari } = detectPlatform();
  if (isIOS) {
    return `<div class="gate-instructions"><b>Install on iPhone/iPad:</b>
      <ol><li>Tap the <b>Share</b> icon in Safari's toolbar</li>
      <li>Scroll down and tap <b>Add to Home Screen</b></li>
      <li>Tap <b>Add</b>, then open TransApple Technologies from your home screen</li></ol></div>`;
  }
  if (isAndroid) {
    return `<div class="gate-instructions"><b>Install on Android:</b>
      <ol><li>Tap the <b>⋮</b> menu in your browser</li>
      <li>Tap <b>Install app</b> (or <b>Add to Home screen</b>)</li>
      <li>Confirm, then open TransApple Technologies from your home screen</li></ol></div>`;
  }
  return `<div class="gate-instructions"><b>Install on desktop:</b>
    <ol><li>Click the install icon in your address bar (or the browser menu)</li>
    <li>Choose <b>Install TransApple Technologies</b></li>
    <li>Launch it from your desktop/apps going forward</li></ol></div>`;
}

function renderInstallGate(justInstalled) {
  const el = document.getElementById("installGate");
  const bootSplash = document.getElementById("bootSplash");
  if (bootSplash) bootSplash.classList.add("is-hidden");
  document.getElementById("app").innerHTML = "";
  el.style.display = "flex";

  if (justInstalled) {
    el.innerHTML = `<div class="gate-card">
      <img class="app-logo gate-logo" src="${APP_LOGO_URL}" alt="TransApple Technologies">
      <div class="gate-title">TransApple <span>Technologies</span></div>
      <div class="gate-success">✓ Installed! Open TransApple Technologies from your home screen or app list to continue.</div>
    </div>`;
    return;
  }

  el.innerHTML = `<div class="gate-card">
    <img class="app-logo gate-logo" src="${APP_LOGO_URL}" alt="TransApple Technologies">
    <div class="gate-title">TransApple <span>Technologies</span></div>
    <div class="gate-desc">This is an installable app. Install it to your device to continue — it only takes a moment.</div>
    <button class="gate-btn" id="installNowBtn">Install App</button>
    <button class="gate-btn gate-btn-secondary" id="continueBrowserBtn">Continue in browser</button>
    <div id="gateInstructionsSlot"></div>
  </div>`;

  document.getElementById("installNowBtn").onclick = async () => {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      const { outcome } = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      if (outcome !== "accepted") renderInstallGate(); // stays on the gate either way
    } else {
      document.getElementById("gateInstructionsSlot").innerHTML = installInstructionsHtml();
    }
  };
  document.getElementById("continueBrowserBtn").onclick = continueInBrowserNow;
}

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  if (!isStandaloneDisplay() && !continuedInBrowser) renderInstallGate();
});

window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  renderInstallGate(true);
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

returns void language plpgsql security definer as $$

drop function if exists register_school(text,text,text,text,text,text,text,text,text,text,text,text,text);
drop function if exists register_school(text,text,text,text,text,text,text,text,text,text,text,text,text,text,text);

  values (

    nullif(trim(p_school_village),''), nullif(trim(p_school_subcounty),''), nullif(trim(p_school_district),''),

  insert into profiles (

    nullif(p_admin_phone,''), nullif(p_admin_whatsapp,''), nullif(p_admin_email,''),
    nullif(p_admin_pin,''), crypt(p_admin_password, gen_salt('bf')), 'staff', p_admin_photo_url, new_school.id, true

-- Login now also blocks accounts whose school is pending/suspended/deactivated.
drop function if exists verify_login(text, text);
create function verify_login(p_username text, p_password text) returns profiles
language plpgsql security definer as $verify_login$
declare found_row profiles; school_row schools;
begin
  select * into found_row from profiles where username = p_username;
  if found_row.id is null or found_row.password_hash is null
     or crypt(p_password, found_row.password_hash) <> found_row.password_hash then
    raise exception 'Incorrect username or password.';
  end if;
  if found_row.deleted_at is not null then
    raise exception 'This account has been deleted. Contact Administration.';
  end if;
  if found_row.suspended_at is not null then
    raise exception 'This account is suspended. Contact Administration.';
  end if;
  if found_row.school_id is not null then
    select * into school_row from schools where id = found_row.school_id;
    if school_row.status = 'pending' then
      raise exception 'Your school is still awaiting approval by TransApple. Please check back soon.';
    elsif school_row.status = 'rejected' then
      raise exception 'Your school''s registration was not approved. Contact TransApple for more information.';
    elsif school_row.status = 'suspended' then
      raise exception 'Your school''s account is suspended. Contact TransApple to resolve this.';
    elsif school_row.status = 'deactivated' then
      raise exception 'Your school''s account has been deactivated. Contact TransApple for help.';
    end if;
  end if;
  found_row.password_hash := null;
  return found_row;
end;
$verify_login$;
grant execute on function verify_login(text,text) to anon, authenticated;

-- Logs a payment and extends the subscription's expiry date.

create function record_school_payment(p_school_id uuid, p_amount numeric, p_method text, p_note text, p_extend_days integer)
returns school_payments language plpgsql security definer as $$
declare current_expiry date; new_expiry date; new_row school_payments;
begin
  if p_amount is null or p_amount <= 0 then
    raise exception 'Enter a valid amount.';
  end if;
  select subscription_expires_at into current_expiry from schools where id = p_school_id;
  new_expiry := greatest(coalesce(current_expiry, current_date), current_date) + make_interval(days => coalesce(p_extend_days,0));
  update schools set subscription_expires_at = new_expiry where id = p_school_id;
  insert into school_payments (school_id, amount, method, note, extended_days, new_expires_at)
  values (p_school_id, p_amount, nullif(p_method,''), nullif(p_note,''), p_extend_days, new_expiry)
  returning * into new_row;
  return new_row;
end;
$$;

create function mother_reset_admin_password(p_school_id uuid, p_profile_id uuid, p_new_password text)
returns void language plpgsql security definer as $$
declare found_row profiles;
begin
  select * into found_row from profiles where id = p_profile_id and school_id = p_school_id;
  if found_row.id is null then
    raise exception 'That account was not found at this school.';
  end if;
  if p_new_password is null or length(p_new_password) < 6 then
    raise exception 'New password must be at least 6 characters.';

end;

-- Grants or revokes "administration" (full-access) privileges for a staff
-- member. Won't let you revoke a school's last remaining administrator.
drop function if exists set_admin_privilege(uuid, uuid, boolean);
create function set_admin_privilege(p_school_id uuid, p_profile_id uuid, p_grant boolean)
returns void language plpgsql security definer as $$
declare found_row profiles; admin_count integer;
begin
  select * into found_row from profiles where id = p_profile_id and school_id = p_school_id;
  if found_row.id is null then
    raise exception 'That account was not found at this school.';
  end if;
  if p_grant then
    update profiles set department = 'administration' where id = p_profile_id;
  else
    select count(*) into admin_count from profiles
      where school_id = p_school_id and department = 'administration' and deleted_at is null;
    if admin_count <= 1 then
      raise exception 'This school must keep at least one administrator. Grant another admin first.';
    end if;
    update profiles set department = 'staff' where id = p_profile_id;
  end if;
end;
$$;
grant execute on function set_admin_privilege(uuid,uuid,boolean) to anon, authenticated;`;

create policy "Mother app can manage audit log" on audit_log for all using (true) with check (true);

-- Login activity: every attempt (success or failure) against mother_admins,
-- so repeated failures against one username are visible as suspicious access.
create table if not exists mother_login_log (
  id uuid primary key default gen_random_uuid(),
  username text not null,
  success boolean not null,
  created_at timestamptz not null default now()
);
alter table mother_login_log enable row level security;
drop policy if exists "Mother app can manage login log" on mother_login_log;
create policy "Mother app can manage login log" on mother_login_log for all using (true) with check (true);

-- Login now logs every attempt, blocks deactivated admins, and returns role.
drop function if exists verify_mother_login(text, text);
create function verify_mother_login(p_username text, p_password text)
returns table(id uuid, username text, full_name text, role text)
language plpgsql security definer as $$
declare found mother_admins;
begin
  select * into found from mother_admins where mother_admins.username = p_username;
  if found.id is null or crypt(p_password, found.password_hash) <> found.password_hash then
    insert into mother_login_log (username, success) values (p_username, false);
    raise exception 'Incorrect username or password.';
  end if;
  if found.active is false then
    insert into mother_login_log (username, success) values (p_username, false);
    raise exception 'This admin account has been deactivated.';
  end if;
  insert into mother_login_log (username, success) values (p_username, true);
  return query select found.id, found.username, found.full_name, found.role;
end;
$$;
grant execute on function verify_mother_login(text,text) to anon, authenticated;

-- Remembered-session restore now also respects active/role.
drop function if exists restore_mother_session(text);
create function restore_mother_session(p_username text)
returns table(id uuid, username text, full_name text, role text)
language plpgsql security definer as $$
begin
  return query select mother_admins.id, mother_admins.username, mother_admins.full_name, mother_admins.role
    from mother_admins where mother_admins.username = p_username and mother_admins.active is true;
end;
$$;
grant execute on function restore_mother_session(text) to anon, authenticated;

-- Creating a new admin now also requires the creator to be full_access (not
-- just any logged-in admin), accepts a role for the new account, and logs it.
drop function if exists create_mother_admin(text, text, text, text, text);
drop function if exists create_mother_admin(text, text, text, text, text, text);
create function create_mother_admin(p_creator_username text, p_creator_password text, p_new_username text, p_new_password text, p_new_full_name text default null, p_new_role text default 'full_access')
returns void language plpgsql security definer as $$
declare creator mother_admins;
begin
  select * into creator from mother_admins where mother_admins.username = p_creator_username;
  if creator.id is null or crypt(p_creator_password, creator.password_hash) <> creator.password_hash then
    raise exception 'Your password could not be verified.';
  end if;
  if creator.role <> 'full_access' then
    raise exception 'Only full-access admins can add new admins.';
  end if;
  if exists (select 1 from mother_admins where username = p_new_username) then
    raise exception 'That username already exists.';
  end if;
  insert into mother_admins (username, password_hash, full_name, role)
  values (p_new_username, crypt(p_new_password, gen_salt('bf')), p_new_full_name, coalesce(nullif(p_new_role,''), 'full_access'));
  insert into audit_log (actor_username, action, target_type, target_id, details)
  values (p_creator_username, 'create_admin', 'mother_admin', p_new_username, 'role=' || coalesce(p_new_role,'full_access'));
end;
$$;
grant execute on function create_mother_admin(text,text,text,text,text,text) to anon, authenticated;

-- Lists mother admins (no password hashes) for the Security tab.
drop function if exists list_mother_admins();
create function list_mother_admins()
returns table(id uuid, username text, full_name text, role text, active boolean, created_at timestamptz)
language plpgsql security definer as $$
begin
  return query select mother_admins.id, mother_admins.username, mother_admins.full_name,
    mother_admins.role, mother_admins.active, mother_admins.created_at
    from mother_admins order by mother_admins.created_at asc;
end;
$$;
grant execute on function list_mother_admins() to anon, authenticated;

-- Changes another admin's role/active status. Requires the acting admin's own
-- password as proof, requires the actor to be full_access, and always leaves
-- at least one active full_access admin standing.
drop function if exists set_mother_admin_status(text, text, uuid, text, boolean);
create function set_mother_admin_status(p_actor_username text, p_actor_password text, p_target_id uuid, p_new_role text, p_new_active boolean)
returns void language plpgsql security definer as $$
declare actor mother_admins; target mother_admins; remaining integer;
begin
  select * into actor from mother_admins where username = p_actor_username;
  if actor.id is null or crypt(p_actor_password, actor.password_hash) <> actor.password_hash then
    raise exception 'Your password could not be verified.';
  end if;
  if actor.role <> 'full_access' then
    raise exception 'Only full-access admins can change admin roles or status.';
  end if;
  select * into target from mother_admins where id = p_target_id;
  if target.id is null then
    raise exception 'Admin not found.';
  end if;
  if p_new_role <> 'full_access' or p_new_active is false then
    select count(*) into remaining from mother_admins
      where role = 'full_access' and active = true and id <> target.id;
    if remaining = 0 then
      raise exception 'At least one active, full-access admin must remain.';
    end if;
  end if;
  update mother_admins set role = coalesce(nullif(p_new_role,''), role), active = coalesce(p_new_active, active)
    where id = p_target_id;
  insert into audit_log (actor_username, action, target_type, target_id, details)
  values (p_actor_username, 'update_admin_status', 'mother_admin', target.username, 'role=' || p_new_role || ' active=' || p_new_active);
end;
$$;
grant execute on function set_mother_admin_status(text,text,uuid,text,boolean) to anon, authenticated;`;

/* ---------------- FEATURE / MODULE CONTROL (run once) ----------------
   One jsonb column on the existing `schools` table — no new tables, no new
   RPCs needed, since `schools` already has a permissive "for all" policy for
   the mother app (see MOTHER_SETUP_SQL above) and the school app already
   reads `schools` with an open "select" policy for every column. */
const SCHOOL_FEATURES_SQL = `alter table schools add column if not exists features jsonb not null default '{}'::jsonb;`;

/* ---------------- DANGER ZONE: WIPE / DELETE A SCHOOL (run once) ----------------
   Needs MOTHER_SECURITY_SQL above already run (uses mother_admins.role and
   audit_log). Two functions:
   - purge_school_data(): deletes every row belonging to one school across
     every school-scoped table, but leaves the `schools` row itself (and its
     plan/features/status) in place. Use this to wipe a school clean without
     removing its account.
   - delete_school_completely(): calls purge_school_data() and then deletes
     the `schools` row too. The school disappears from this app entirely.
   Both require a FULL-ACCESS admin's own password as proof, exactly like
   other destructive actions in this app, and both are logged to audit_log.
   IRREVERSIBLE — there is no undo here, and purge_school_data() has no
   soft-delete. delete_school_completely() itself is superseded below by
   SCHOOL_TRASH_SQL's soft_delete_school() for the app's "Delete school"
   button — kept here only as the low-level building block the Danger Zone's
   "Clear all data" path still calls (via purge_school_data). */
const SCHOOL_DANGER_ZONE_SQL = `drop function if exists purge_school_data(text, text, uuid);
create function purge_school_data(p_actor_username text, p_actor_password text, p_school_id uuid)
returns void language plpgsql security definer as $$
declare actor mother_admins; t text;
begin
  select * into actor from mother_admins where mother_admins.username = p_actor_username;
  if actor.id is null or crypt(p_actor_password, actor.password_hash) <> actor.password_hash then
    raise exception 'Your password could not be verified.';
  end if;
  if actor.active is not true then
    raise exception 'Your account is deactivated.';
  end if;
  if actor.role <> 'full_access' then
    raise exception 'Only full-access admins can delete school data.';
  end if;
  if p_school_id is null or not exists (select 1 from schools where id = p_school_id) then
    raise exception 'School not found.';
  end if;

  -- Bypass foreign-key/trigger ordering for this transaction only, so every
  -- school-scoped table can be cleared regardless of which references which.
  -- (SET LOCAL automatically reverts at the end of this function's transaction.)
  set local session_replication_role = replica;

  foreach t in array array[
    -- Every table the school app scopes by school_id (see MULTI_SCHOOL_SQL),
    -- plus fee_reminders which was added afterwards. Keep this list in sync
    -- with that one if the school app ever adds a new school-scoped table.
    'parent_messages','private_messages','parent_students','fee_reminders','account_change_requests',
    'exam_results','attendance','staff_attendance','fee_payments','fee_structures',
    'exams','exam_types','grades','class_subjects','subjects','classes','terms',
    'school_communications','school_meetings','school_settings',
    'students','teachers','profiles'
  ]
  loop
    if to_regclass(t) is not null
       and exists (
         select 1 from information_schema.columns
         where table_schema = 'public' and table_name = t and column_name = 'school_id'
       )
    then
      if t = 'profiles' then
        -- Keep administration-department accounts so the school's admin can
        -- still log back in after a purge and rebuild from a clean slate.
        execute format(
          'delete from %I where school_id = %L and department is distinct from %L',
          t, p_school_id, 'administration'
        );
      else
        execute format('delete from %I where school_id = %L', t, p_school_id);
      end if;
    end if;
  end loop;

  -- Mother-system-owned records tied to this school.
  if to_regclass('school_payments') is not null then delete from school_payments where school_id = p_school_id; end if;
  if to_regclass('school_support_requests') is not null then delete from school_support_requests where school_id = p_school_id; end if;
  if to_regclass('platform_error_log') is not null then update platform_error_log set school_id = null where school_id = p_school_id; end if;

  insert into audit_log (actor_username, action, target_type, target_id, details)
  values (p_actor_username, 'purge_school_data', 'school', p_school_id::text, 'every data row for this school was permanently deleted');
end;
$$;
grant execute on function purge_school_data(text,text,uuid) to anon, authenticated;

drop function if exists delete_school_completely(text, text, uuid);
create function delete_school_completely(p_actor_username text, p_actor_password text, p_school_id uuid)
returns void language plpgsql security definer as $$
declare school_name text;
begin
  select name into school_name from schools where id = p_school_id;
  perform purge_school_data(p_actor_username, p_actor_password, p_school_id);
  delete from schools where id = p_school_id;
  insert into audit_log (actor_username, action, target_type, target_id, details)
  values (p_actor_username, 'delete_school_completely', 'school', p_school_id::text, 'school "' || coalesce(school_name,'') || '" and all its data were permanently deleted');
end;
$$;
grant execute on function delete_school_completely(text,text,uuid) to anon, authenticated;`;

/* ---------------- SCHOOL TRASH: 30-DAY AUTO-PURGE, NO RESTORE (run once, after SCHOOL_DANGER_ZONE_SQL) ----------------
   Replaces the old instant "Delete school completely" with a 30-day Trash:
     1) soft_delete_school() — the app's "Delete school" button now calls
        this instead of delete_school_completely(). It only stamps
        schools.deleted_at / deleted_by; no data is touched yet. Login is
        blocked immediately for every account at that school (verify_login
        in the school app checks schools.deleted_at and shows the school's
        name in the message — see the school app's own SQL for that).
     2) purge_expired_trashed_schools() — safe to call anytime; it only ever
        acts on schools whose deleted_at is 30+ days in the past. It wipes
        every data row for each one (same table list as purge_school_data
        above) and then deletes the schools row itself. Both apps call this
        once on startup (see loadSchools()/app boot in the JS), which is
        enough to guarantee the purge happens "automatically" the next time
        either app is opened after the 30 days are up — no admin action
        needed, and there is no restore path once it runs.
     For a true zero-touch guarantee even if nobody opens either app for a
     while, optionally enable pg_cron (Supabase → Database → Extensions) and
     run once:
       select cron.schedule('purge-expired-trashed-schools', '0 3 * * *',
         $$select purge_expired_trashed_schools();$$);
     This is optional — everything above works without it. */
const SCHOOL_TRASH_SQL = `alter table schools add column if not exists deleted_at timestamptz;
alter table schools add column if not exists deleted_by text;

-- Moves a school to Trash. Requires a FULL-ACCESS admin's own password,
-- exactly like every other destructive action in this app. Nothing is
-- deleted yet — only deleted_at/deleted_by are stamped — but login is
-- blocked for the whole school from this moment on.
drop function if exists soft_delete_school(text, text, uuid);
create function soft_delete_school(p_actor_username text, p_actor_password text, p_school_id uuid)
returns void language plpgsql security definer as $$
declare actor mother_admins; school_row schools;
begin
  select * into actor from mother_admins where mother_admins.username = p_actor_username;
  if actor.id is null or crypt(p_actor_password, actor.password_hash) <> actor.password_hash then
    raise exception 'Your password could not be verified.';
  end if;
  if actor.active is not true then
    raise exception 'Your account is deactivated.';
  end if;
  if actor.role <> 'full_access' then
    raise exception 'Only full-access admins can delete a school.';
  end if;

  select * into school_row from schools where id = p_school_id;
  if school_row.id is null then
    raise exception 'School not found.';
  end if;
  if school_row.deleted_at is not null then
    raise exception 'This school is already in Trash.';
  end if;

  update schools set deleted_at = now(), deleted_by = p_actor_username where id = p_school_id;
  insert into audit_log (actor_username, action, target_type, target_id, details)
  values (p_actor_username, 'soft_delete_school', 'school', p_school_id::text,
    '"' || coalesce(school_row.name,'') || '" was moved to Trash — login is blocked immediately; it will be permanently deleted with no restore in 30 days');
end;
$$;
grant execute on function soft_delete_school(text,text,uuid) to anon, authenticated;

-- Internal only (no grant): wipes every data row for one school, same table
-- list as purge_school_data() above, then removes the schools row itself.
-- Only ever called from purge_expired_trashed_schools() below.
drop function if exists purge_school_and_row(uuid);
create function purge_school_and_row(p_school_id uuid)
returns void language plpgsql security definer as $$
declare t text; school_name text;
begin
  select name into school_name from schools where id = p_school_id;

  set local session_replication_role = replica;
  foreach t in array array[
    'parent_messages','private_messages','parent_students','fee_reminders','account_change_requests',
    'exam_results','attendance','staff_attendance','fee_payments','fee_structures',
    'exams','exam_types','grades','class_subjects','subjects','classes','terms',
    'school_communications','school_meetings','school_settings',
    'students','teachers','profiles'
  ]
  loop
    if to_regclass(t) is not null
       and exists (
         select 1 from information_schema.columns
         where table_schema = 'public' and table_name = t and column_name = 'school_id'
       )
    then
      execute format('delete from %I where school_id = %L', t, p_school_id);
    end if;
  end loop;

  if to_regclass('school_payments') is not null then delete from school_payments where school_id = p_school_id; end if;
  if to_regclass('school_support_requests') is not null then delete from school_support_requests where school_id = p_school_id; end if;
  if to_regclass('school_login_log') is not null then delete from school_login_log where school_id = p_school_id; end if;
  if to_regclass('platform_error_log') is not null then update platform_error_log set school_id = null where school_id = p_school_id; end if;

  delete from schools where id = p_school_id;

  insert into audit_log (actor_username, action, target_type, target_id, details)
  values ('system', 'auto_purge_trashed_school', 'school', p_school_id::text,
    '"' || coalesce(school_name,'') || '" reached the end of its 30-day Trash window and was permanently deleted, with all its data — no restore possible');
end;
$$;

-- Automatic sweep. No password needed to call this — it never acts on a
-- school before its 30 days are up, so exposing it doesn't let anyone skip
-- or shorten the retention window. Both apps call this once on startup.
drop function if exists purge_expired_trashed_schools();
create function purge_expired_trashed_schools()
returns integer language plpgsql security definer as $$
declare rec record; n integer := 0;
begin
  for rec in select id from schools where deleted_at is not null and deleted_at <= now() - interval '30 days'
  loop
    perform purge_school_and_row(rec.id);
    n := n + 1;
  end loop;
  return n;
end;
$$;
grant execute on function purge_expired_trashed_schools() to anon, authenticated;`;


/* ---------------- SCHOOL SELF-UPGRADE UPGRADE (run once, after SCHOOL_DANGER_ZONE_SQL) ----------------
   Brings a school created before self-registration existed (back when
   createSchool() only wrote a bare `name` — no school_code, motto, location,
   or school password) up onto the current registration format, entirely
   self-service, with no mother-admin data entry and no ability to change a
   school's id:
     1) Mother marks an old-format school "Upgrade Available" (mark_school_upgrade_available).
     2) The school's own Administrator sees this inside the school app (bell notification +
        Settings) and submits a School Registration Form there.
     3) complete_school_upgrade() — called from the SCHOOL APP, verified against the acting
        Administrator's own login, not a mother admin's — auto-generates a unique School ID
        (TATNOVA followed by 7 random digits, retried until unique) and fills in motto,
        village, subcounty, district, size_range and a school login password, never
        overwriting anything already set. All existing data (students, staff, parents, fees,
        attendance, exams, report cards, settings) is completely untouched; only the schools
        row changes, and the school's id itself never changes.
   Two timestamp columns give the Mother App three states to show per school:
     - No upgrade         : upgrade_requested_at is null
     - Pending upgrade     : upgrade_requested_at is set, upgrade_completed_at is null
     - Successful upgrade  : upgrade_completed_at is set
   Safe to re-run. */
const MOTHER_SELF_UPGRADE_SQL = `-- Two timestamps drive the three states the Mother App shows per school.
alter table schools add column if not exists upgrade_requested_at timestamptz;
alter table schools add column if not exists upgrade_completed_at timestamptz;

-- Marks an old-format school "Upgrade Available" — the school's own
-- Administrator will see the prompt next time they open the app.
drop function if exists mark_school_upgrade_available(text,text,uuid);
create function mark_school_upgrade_available(p_actor_username text, p_actor_password text, p_school_id uuid)
returns schools language plpgsql security definer as $$
declare actor mother_admins; s schools;
begin
  select * into actor from mother_admins where username = p_actor_username;
  if actor.id is null or crypt(p_actor_password, actor.password_hash) <> actor.password_hash then
    raise exception 'Your password could not be verified.';
  end if;
  if actor.active is not true then
    raise exception 'Your account is deactivated.';
  end if;

  select * into s from schools where id = p_school_id;
  if s.id is null then
    raise exception 'School not found.';
  end if;
  if s.school_code is not null then
    raise exception 'This school is already in the new format.';
  end if;

  update schools set upgrade_requested_at = now(), upgrade_completed_at = null where id = p_school_id;
  insert into audit_log (actor_username, action, target_type, target_id, details)
  values (p_actor_username, 'mark_school_upgrade_available', 'school', p_school_id::text, 'marked "' || coalesce(s.name,'') || '" as upgrade available');

  select * into s from schools where id = p_school_id;
  return s;
end;
$$;
grant execute on function mark_school_upgrade_available(text,text,uuid) to anon, authenticated;

-- Cancels a pending upgrade prompt (e.g. marked by mistake). Has no effect
-- once the school has already completed it.
drop function if exists cancel_school_upgrade_request(text,text,uuid);
create function cancel_school_upgrade_request(p_actor_username text, p_actor_password text, p_school_id uuid)
returns schools language plpgsql security definer as $$
declare actor mother_admins; s schools;
begin
  select * into actor from mother_admins where username = p_actor_username;
  if actor.id is null or crypt(p_actor_password, actor.password_hash) <> actor.password_hash then
    raise exception 'Your password could not be verified.';
  end if;
  if actor.active is not true then
    raise exception 'Your account is deactivated.';
  end if;

  select * into s from schools where id = p_school_id;
  if s.id is null then
    raise exception 'School not found.';
  end if;

  update schools set upgrade_requested_at = null where id = p_school_id and upgrade_completed_at is null;
  insert into audit_log (actor_username, action, target_type, target_id, details)
  values (p_actor_username, 'cancel_school_upgrade_request', 'school', p_school_id::text, 'cancelled the pending upgrade prompt for "' || coalesce(s.name,'') || '"');

  select * into s from schools where id = p_school_id;
  return s;
end;
$$;
grant execute on function cancel_school_upgrade_request(text,text,uuid) to anon, authenticated;

-- Called from inside the SCHOOL APP by the school's own Administrator once
-- they submit the upgrade form — NOT by a mother admin. Verifies the acting
-- profile is really an active, non-deleted, non-suspended Administration-
-- department staff member of this exact school before touching anything.
drop function if exists complete_school_upgrade(uuid,text,text,text,text,text,text,text,text,text);
drop function if exists complete_school_upgrade(uuid,text,text,text,text,text,text,text,text);
create function complete_school_upgrade(
  p_school_id uuid, p_actor_username text, p_actor_password text,
  p_school_code text default null, p_motto text default null,
  p_village text default null, p_subcounty text default null, p_district text default null,
  p_size_range text default null
) returns schools language plpgsql security definer as $$
declare actor profiles; s schools; candidate_code text;
begin
  select * into actor from profiles where username = p_actor_username;
  if actor.id is null or actor.password_hash is null or crypt(p_actor_password, actor.password_hash) <> actor.password_hash then
    raise exception 'Your password could not be verified.';
  end if;
  if actor.deleted_at is not null or actor.suspended_at is not null then
    raise exception 'Your account cannot perform this action.';
  end if;
  if actor.school_id is null or actor.school_id <> p_school_id then
    raise exception 'You can only upgrade your own school.';
  end if;
  if actor.department <> 'administration' then
    raise exception 'Only an Administrator can complete this upgrade.';
  end if;

  select * into s from schools where id = p_school_id;
  if s.id is null then
    raise exception 'School not found.';
  end if;
  if s.upgrade_requested_at is null then
    raise exception 'There is no pending upgrade for this school.';
  end if;

  if s.school_code is null or trim(s.school_code) = '' then
    if p_school_code is not null and trim(p_school_code) <> '' then
      if exists (select 1 from schools where school_code = p_school_code and id <> p_school_id) then
        raise exception 'That School ID (code) is already taken by another school.';
      end if;
      if p_school_code !~ '^[A-Za-z0-9_]+$' then
        raise exception 'School ID (code) can only contain letters, numbers and underscores.';
      end if;
      update schools set school_code = p_school_code where id = p_school_id;
    else
      loop
        candidate_code := 'TATNOVA' || lpad(floor(random() * 10000000)::text, 7, '0');
        exit when not exists (select 1 from schools where school_code = candidate_code);
      end loop;
      update schools set school_code = candidate_code where id = p_school_id;
    end if;
  end if;

  update schools set
    motto      = case when (motto is null or trim(motto) = '')           and p_motto is not null      and trim(p_motto) <> ''      then trim(p_motto)      else motto end,
    village    = case when (village is null or trim(village) = '')       and p_village is not null    and trim(p_village) <> ''    then trim(p_village)    else village end,
    subcounty  = case when (subcounty is null or trim(subcounty) = '')   and p_subcounty is not null  and trim(p_subcounty) <> ''  then trim(p_subcounty)  else subcounty end,
    district   = case when (district is null or trim(district) = '')     and p_district is not null   and trim(p_district) <> ''   then trim(p_district)   else district end,
    size_range = case when (size_range is null or trim(size_range) = '') and p_size_range is not null and trim(p_size_range) <> '' then trim(p_size_range) else size_range end
  where id = p_school_id;

  update schools set upgrade_completed_at = now() where id = p_school_id;

  insert into audit_log (actor_username, action, target_type, target_id, details)

$$;

/* ---------------- SCHOOL ACTIVITY UPGRADE (run once, after MOTHER_OPS_SQL) ----------------
   Adds a per-school login activity log — every attempt against that school's
   own accounts (profiles), success or failure — so a school's "Activity" tab
   can show who logged in, when, how often, and any failed/incorrect attempts.
   This is the school-scoped counterpart to mother_login_log above, which only
   covers logins to THIS mother app, not to the school app itself. */
const SCHOOL_ACTIVITY_SQL = `create table if not exists school_login_log (
  id uuid primary key default gen_random_uuid(),
  school_id uuid references schools(id) on delete cascade,
  username text not null,
  success boolean not null,
  created_at timestamptz not null default now()
);
alter table school_login_log enable row level security;
drop policy if exists "Anyone can log school logins" on school_login_log;
create policy "Anyone can log school logins" on school_login_log for insert with check (true);
drop policy if exists "Mother app can read school login log" on school_login_log;
create policy "Mother app can read school login log" on school_login_log for select using (true);
drop policy if exists "Mother app can delete school login log" on school_login_log;
create policy "Mother app can delete school login log" on school_login_log for delete using (true);

-- verify_login now also records every attempt (success or failure) to
-- school_login_log, on top of everything it already did.
drop function if exists verify_login(text, text);
create function verify_login(p_username text, p_password text) returns profiles
language plpgsql security definer as $verify_login$
declare found_row profiles; school_row schools;
begin
  select * into found_row from profiles where username = p_username;
  if found_row.id is null or found_row.password_hash is null
     or crypt(p_password, found_row.password_hash) <> found_row.password_hash then
    insert into school_login_log (school_id, username, success) values (found_row.school_id, p_username, false);
    raise exception 'Incorrect username or password.';
  end if;
  if found_row.deleted_at is not null then
    insert into school_login_log (school_id, username, success) values (found_row.school_id, p_username, false);
    raise exception 'This account has been deleted. Contact Administration.';
  end if;
  if found_row.suspended_at is not null then
    insert into school_login_log (school_id, username, success) values (found_row.school_id, p_username, false);
    raise exception 'This account is suspended. Contact Administration.';
  end if;
  if found_row.school_id is not null then
    select * into school_row from schools where id = found_row.school_id;
    if school_row.status = 'pending' then
      insert into school_login_log (school_id, username, success) values (found_row.school_id, p_username, false);
      raise exception 'Your school is still awaiting approval by TransApple. Please check back soon.';
    elsif school_row.status = 'rejected' then
      insert into school_login_log (school_id, username, success) values (found_row.school_id, p_username, false);
      raise exception 'Your school''s registration was not approved. Contact TransApple for more information.';
    elsif school_row.status = 'suspended' then
      insert into school_login_log (school_id, username, success) values (found_row.school_id, p_username, false);
      raise exception 'Your school''s account is suspended. Contact TransApple to resolve this.';
    elsif school_row.status = 'deactivated' then
      insert into school_login_log (school_id, username, success) values (found_row.school_id, p_username, false);
      raise exception 'Your school''s account has been deactivated. Contact TransApple for help.';
    end if;
  end if;
  update profiles set last_login_at = now() where id = found_row.id;
  insert into school_login_log (school_id, username, success) values (found_row.school_id, p_username, true);
  found_row.password_hash := null;
  return found_row;
end;
$verify_login$;
grant execute on function verify_login(text,text) to anon, authenticated;`;

/* ---------------- RISK & RETENTION UPGRADE (run once, after MOTHER_OPS_SQL) ----------------
   Adds: a per-school engagement view (last login, active users — used to flag
   schools going quiet before they churn), a push-subscription table (so this
   device can receive real push notifications, even closed), and a dedupe
   table so the same alert never gets pushed twice. This SQL only prepares the
   data — actually sending pushes needs the separate Edge Function described
   in the Risk & Retention tab. Safe to re-run. */
const RISK_ALERTS_SQL = `-- Per-school engagement: last login across all of a school's users, and how
-- many distinct users logged in during the last 7 days. Powers the "going
-- quiet" list — nothing here pushes anything, it's just a read-only view.
create or replace view school_engagement as
select
  s.id as school_id,
  s.name,
  s.status,
  s.subscription_expires_at,
  max(p.last_login_at) as last_login_at,
  count(*) filter (where p.last_login_at >= now() - interval '7 days') as active_users_7d,
  count(*) filter (where p.deleted_at is null) as total_users
from schools s
left join profiles p on p.school_id = s.id and p.deleted_at is null
group by s.id, s.name, s.status, s.subscription_expires_at;
grant select on school_engagement to anon, authenticated;

-- One row per browser/device subscribed to push alerts from this app.

create policy "Mother app can manage push subscriptions" on push_subscriptions for all using (true) with check (true);

-- Records which alerts have already been sent so the scheduled checker never
-- pushes the same thing twice (e.g. the same school's expiry, the same
-- inactivity window). alert_key is something like 'expired:<school_id>' or
-- 'inactive30:<school_id>:2026-07-30' — unique, so a repeat insert fails and

// Powers the Database Updates screen: every pending SQL migration the school
// app (or the Mother App itself) needs lives here instead of being shown
// inline in the school app. A mother admin copies sql_code into Supabase's
// SQL Editor, then marks the row Applied (or Failed, with a note, so it
// stays visible until it's retried successfully) — or, for anything that
// doesn't need superuser/extension privileges, taps "Run now" to have
// run_database_update() execute it directly and flip the status itself.
//
// run_database_update() requires a FULL-ACCESS admin's own password as
// proof, exactly like every other destructive action in this app (see
// purge_school_data/delete_school_completely above) — but note this one is
// strictly more powerful than those: it executes whatever text sits in
// sql_code with this function's elevated privileges. The entire safety net
// here is "only a verified full-access mother admin can trigger it" — there
// is no per-statement allowlist. Treat mother_admin passwords accordingly,
// and prefer the manual copy/paste path for anything you haven't reviewed.
const DATABASE_UPDATES_SQL = `create table if not exists database_updates (
  id uuid primary key default gen_random_uuid(),
  title text not null,
  description text,
  sql_code text not null,
  status text not null default 'pending' check (status in ('pending','applied','failed')),
  error_message text,
  created_at timestamptz not null default now(),
  applied_at timestamptz
);
alter table database_updates enable row level security;
drop policy if exists "Mother app can manage database updates" on database_updates;
create policy "Mother app can manage database updates" on database_updates for all using (true) with check (true);

drop function if exists run_database_update(text, text, uuid);
create function run_database_update(p_actor_username text, p_actor_password text, p_update_id uuid)
returns database_updates language plpgsql security definer as $$
declare actor mother_admins; upd database_updates; err text;
begin
  select * into actor from mother_admins where mother_admins.username = p_actor_username;
  if actor.id is null or crypt(p_actor_password, actor.password_hash) <> actor.password_hash then
    raise exception 'Your password could not be verified.';
  end if;
  if actor.active is not true then
    raise exception 'Your account is deactivated.';
  end if;
  if actor.role <> 'full_access' then
    raise exception 'Only full-access admins can run database updates.';
  end if;

  select * into upd from database_updates where id = p_update_id;
  if upd.id is null then
    raise exception 'Update not found.';
  end if;

  begin
    execute upd.sql_code;
    update database_updates set status = 'applied', applied_at = now(), error_message = null
      where id = p_update_id returning * into upd;
    insert into audit_log (actor_username, action, target_type, target_id, details)
      values (p_actor_username, 'run_database_update', 'database_update', p_update_id::text, 'applied: ' || upd.title);
  exception when others then
    err := sqlerrm;
    update database_updates set status = 'failed', error_message = err
      where id = p_update_id returning * into upd;
    insert into audit_log (actor_username, action, target_type, target_id, details)
      values (p_actor_username, 'run_database_update_failed', 'database_update', p_update_id::text, 'failed: ' || err);
  end;

  return upd;
end;
$$;
grant execute on function run_database_update(text,text,uuid) to anon, authenticated;`;

const RISK_ALERTS_FUNCTION_CODE = `// supabase/functions/risk-alerts-check/index.ts
//
// Scheduled Edge Function: checks a few "needs attention" conditions and
// sends a real Web Push notification (works even with the app fully closed)
// to every device subscribed via the Risk & Retention tab. Safe to call
// manually or on a Cron schedule (Edge Functions -> risk-alerts-check -> Cron).
//
// Required secrets (Edge Functions -> risk-alerts-check -> Secrets):
//   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, VAPID_PUBLIC_KEY,
//   VAPID_PRIVATE_KEY, VAPID_SUBJECT (e.g. "mailto:you@yourdomain.com")
//
// This function talks to Postgres with the SERVICE ROLE key (bypasses RLS)
// since it runs unattended with no logged-in admin. Never put the service
// role key in the client app itself.

import { createClient } from "npm:@supabase/supabase-js@2";
import webpush from "npm:web-push@3.6.7";

const SUPABASE_URL = Deno.env.get("SUPABASE_URL")!;
const SERVICE_ROLE_KEY = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!;
const VAPID_PUBLIC_KEY = Deno.env.get("VAPID_PUBLIC_KEY")!;
const VAPID_PRIVATE_KEY = Deno.env.get("VAPID_PRIVATE_KEY")!;
const VAPID_SUBJECT = Deno.env.get("VAPID_SUBJECT")!;

webpush.setVapidDetails(VAPID_SUBJECT, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY);
const supabase = createClient(SUPABASE_URL, SERVICE_ROLE_KEY);

// Tries to claim an alert key. Returns true (send it) the first time this
// key is seen, false (skip — already sent) every time after, until the key
// itself changes (e.g. a new day/week/hour bucket rolls around).
async function claim(alertKey: string): Promise<boolean> {
  const { error } = await supabase.from("sent_alerts").insert({ alert_key: alertKey });
  return !error; // a unique-violation error means it was already claimed
}

async function sendToAllSubscriptions(payload: Record<string, unknown>) {
  const { data: subs, error } = await supabase.from("push_subscriptions").select("*");
  if (error || !subs) return 0;
  const body = JSON.stringify(payload);
  let sent = 0;
  for (const sub of subs) {
    const pushSubscription = {
      endpoint: sub.endpoint,
      keys: { p256dh: sub.p256dh, auth: sub.auth },
    };
    try {
      await webpush.sendNotification(pushSubscription, body);
      sent++;
    } catch (err: any) {
      // 404/410 = the browser/OS discarded this subscription; stop trying it.
      if (err && (err.statusCode === 404 || err.statusCode === 410)) {
        await supabase.from("push_subscriptions").delete().eq("endpoint", sub.endpoint);
      }
    }
  }
  return sent;
}

Deno.serve(async (_req) => {
  const now = new Date();
  const today = now.toISOString().slice(0, 10);
  const isoWeek = now.getUTCFullYear() + "-w" + Math.ceil(now.getUTCDate() / 7);
  const hourBucket = now.toISOString().slice(0, 13);

  let alertsSent = 0;

  // --- 1) Payment overdue: active school past subscription_expires_at.
  // Re-notified weekly while it stays overdue, not on every run.
  const { data: engagement } = await supabase
    .from("school_engagement")
    .select("*")
    .eq("status", "active");

  for (const s of engagement || []) {
    if (s.subscription_expires_at && s.subscription_expires_at < today) {
      const key = "payment:" + s.school_id + ":" + isoWeek;
      if (await claim(key)) {
        alertsSent += await sendToAllSubscriptions({
          title: "Subscription overdue",
          body: s.name + "'s subscription expired on " + s.subscription_expires_at + ".",
          url: "/",
        });
      }
    }

    // --- 2) Going quiet: no logins from anyone at this school in 30+ days.
    // Re-notified monthly while it stays true.
    if (s.last_login_at) {
      const daysSince = Math.floor((now.getTime() - new Date(s.last_login_at).getTime()) / 86400000);
      if (daysSince >= 30) {
        const monthBucket = today.slice(0, 7);
        const key = "inactive30:" + s.school_id + ":" + monthBucket;
        if (await claim(key)) {
          alertsSent += await sendToAllSubscriptions({
            title: "School going quiet",
            body: s.name + " hasn't had a login in " + daysSince + " days.",
            url: "/",
          });
        }
      }
    }
  }

  // --- 3) Error spike: 15+ platform errors in the last hour.
  // Re-notified at most once per hour bucket.
  const since = new Date(now.getTime() - 60 * 60000).toISOString();
  const { count } = await supabase
    .from("platform_error_log")
    .select("id", { count: "exact", head: true })
    .gte("created_at", since);

  if ((count || 0) >= 15) {
    const key = "error_spike:" + hourBucket;
    if (await claim(key)) {
      alertsSent += await sendToAllSubscriptions({
        title: "Error spike detected",
        body: (count || 0) + " errors reported in the last hour.",
        url: "/",
      });
    }
  }

  return new Response(JSON.stringify({ checked_at: now.toISOString(), alerts_sent: alertsSent }), {
    headers: { "Content-Type": "application/json" },
  });
});
`;

async function sb(path, opts = {}) {
  const headers = Object.assign({
    "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json",
  }, opts.headers || {});
  let res;
  try { res = await fetch(SUPABASE_URL + path, Object.assign({}, opts, { headers })); }
  catch (e) { throw new Error("Check your internet connection and try again."); }
  let data = null;
  try { data = await res.json(); } catch(e) {}
  if (!res.ok) throw new Error((data && (data.message || data.error_description)) || "Request failed");
  return data;
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const ms = new Date(dateStr + "T00:00:00") - new Date(new Date().toDateString());
  return Math.round(ms / 86400000);
}
function subscriptionBadge(s) {
  if (!s.subscription_expires_at) return `<span class="badge badge-deactivated">No plan set</span>`;
  const d = daysUntil(s.subscription_expires_at);
  if (d < 0) return `<span class="badge badge-suspended">Expired ${Math.abs(d)}d ago</span>`;
  if (d <= 7) return `<span class="badge badge-warn">Expires in ${d}d</span>`;
  if (d <= 30) return `<span class="badge badge-warn">Expires in ${d}d</span>`;
  return `<span class="badge badge-active">Active until ${s.subscription_expires_at}</span>`;
}

function toCSV(rows, columns) {
  const esc = (v) => {
    const s = v == null ? "" : String(v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  };
  const header = columns.map(c => esc(c.label)).join(",");
  const body = rows.map(r => columns.map(c => esc(c.get(r))).join(",")).join("\n");
  return header + "\n" + body;
}
function downloadCSV(filename, csvText) {
  const blob = new Blob([csvText], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

}
function exportSchoolsCSV(schools) {
  const csv = toCSV(schools, [
    { label:"Name", get:s=>s.name },

    { label:"Billing cycle", get:s=>s.billing_cycle||"" },

    { label:"Expires on", get:s=>s.subscription_expires_at||"" },
    { label:"Location", get:s=>schoolLocationLabel(s) },

  ]);
  downloadCSV(`nova-schools-${new Date().toISOString().slice(0,10)}.csv`, csv);
}
// Minimal RFC4180-ish CSV parser: handles quoted fields, escaped quotes ("")
// and commas/newlines inside quotes. Good enough for a small admin-authored
// import file, not meant as a general-purpose CSV library.
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i+1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && next === '\n') i++;
        row.push(field); field = "";
        if (row.some(v => v !== "")) rows.push(row);
        row = [];
      } else field += c;
    }
  }
  if (field !== "" || row.length) { row.push(field); if (row.some(v => v !== "")) rows.push(row); }
  if (!rows.length) return [];
  const header = rows[0].map(h => h.trim().toLowerCase());
  return rows.slice(1).map(r => {
    const obj = {};
    header.forEach((h, i) => { obj[h] = (r[i] || "").trim(); });
    return obj;
  });
}
// Bulk-registers schools from a CSV with a "name" column (required) and
// optional "plan" / "billing cycle" / "amount" / "expires on" columns —
// same shape exportSchoolsCSV() produces, so a round trip just works.
// Each row goes through the normal createSchool()/savePlan() calls (so
// audit-log entries and validation are identical to adding one by hand);
// one bad row doesn't stop the rest, and a summary is reported at the end.
async function importSchoolsCSV(csvText) {
  assertFullAccess();
  const rows = parseCSV(csvText);
  if (!rows.length) throw new Error("No rows found in that file.");
  let created = 0;
  const errors = [];
  for (const r of rows) {
    const name = r.name || r["school name"] || "";
    if (!name) { errors.push(`Row skipped: missing name (${JSON.stringify(r)})`); continue; }
    try {
      const result = await createSchool(name);
      const school = Array.isArray(result) ? result[0] : result;
      const plan = r.plan || "";
      const billingCycle = r["billing cycle"] || r.cycle || "";
      const amount = r["subscription amount"] || r.amount || "";
      const expiresAt = r["expires on"] || r.expires || "";
      if (school && (plan || billingCycle || amount || expiresAt)) {
        await savePlan(school.id, { plan, billingCycle, amount, expiresAt });
      }
      created++;
    } catch (e) { errors.push(`${name}: ${e.message}`); }
  }
  const summary = `Imported ${created} of ${rows.length} school(s).` + (errors.length ? `\n\nSkipped/failed:\n${errors.join("\n")}` : "");
  alert(summary);
  return { created, total: rows.length, errors };
}

// Uses Postgres' exact row count (via the Content-Range header) instead of
// fetching whole tables, so these stay fast even as schools grow.
async function countRows(table, params = {}) {
  const headers = {
    "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY,
    "Prefer": "count=exact",
  };
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${qs(Object.assign({select:"id", limit:"1"}, params))}`, { headers });
  if (!res.ok) throw new Error("Could not load counts.");
  const range = res.headers.get("content-range"); // e.g. "0-0/42"
  return range ? Number(range.split("/")[1]) : 0;
}
async function sumColumn(table, column, params = {}) {
  const rows = await sb(`/rest/v1/${table}?${qs(Object.assign({select:column}, params))}`);
  return rows.reduce((acc, r) => acc + (Number(r[column]) || 0), 0);
}

/* ---------------- MOTHER APP NOTIFICATION BELL ----------------
   Notifies the signed-in admin about open support requests coming in from
   schools — the one thing in this app that's genuinely "something arrived
   for you to look at". There's no per-admin read column server-side, so
   (same convention as the school app's parent/staff bells) read state is
   tracked locally per device/admin in localStorage; opening the panel
   clears the badge immediately. */
function motherBellReadKey() { return `novaMotherReadRequests_${motherAdmin?.id || motherAdmin?.username || "anon"}`; }
function getMotherBellReadIds() {
  try { return new Set(JSON.parse(localStorage.getItem(motherBellReadKey()) || "[]")); }
  catch (e) { return new Set(); }
}
function markMotherBellRead(ids) {
  if (!ids || !ids.length) return;
  const read = getMotherBellReadIds();
  ids.forEach(id => read.add(id));
  try { localStorage.setItem(motherBellReadKey(), JSON.stringify([...read])); } catch (e) {}
}
async function refreshMotherBell() {
  const btn = document.getElementById("motherBellBtn");
  if (!btn) return;
  btn.querySelector(".bell-badge")?.remove();
  let open = [];
  try { open = await listSupportRequests("open"); } catch (e) { return; }
  const read = getMotherBellReadIds();
  const count = open.filter(r => !read.has(r.id)).length;
  if (count > 0) btn.appendChild(el(`<span class="bell-badge">${count > 99 ? "99+" : count}</span>`));
}
function closeMotherBellPanel() {
  document.getElementById("motherBellBackdrop")?.remove();
  document.getElementById("motherBellPanel")?.remove();
}
async function openMotherBellPanel() {
  closeMotherBellPanel();
  const backdrop = el(`<div class="bell-backdrop" id="motherBellBackdrop"></div>`);
  const panel = el(`
    <div class="bell-panel" id="motherBellPanel">
      <div class="bell-panel-head">
        <div style="font-weight:800;font-size:15px;color:var(--navy);">Notifications</div>
        <button class="bell-btn" id="motherBellClose">&times;</button>
      </div>
      <div class="bell-panel-body" id="motherBellBody"><div class="tiny-note">Loading…</div></div>
    </div>`);
  document.body.appendChild(backdrop);
  document.body.appendChild(panel);
  backdrop.onclick = closeMotherBellPanel;
  document.getElementById("motherBellClose").onclick = closeMotherBellPanel;

  let open = [];
  try { open = await listSupportRequests("open"); } catch (e) {}
  const body = document.getElementById("motherBellBody");
  if (!body) return; // closed while loading
  body.innerHTML = open.length ? open.map(r => `
    <div class="bell-item">
      <div class="b-title">${r.subject}</div>
      <div class="b-body">${r.message}</div>
      <div class="b-meta">${r.schools?.name || "Unknown school"} · ${new Date(r.created_at).toLocaleString()}</div>
    </div>`).join("") : `<div class="empty">No open support requests.</div>`;

  markMotherBellRead(open.map(r => r.id));
  refreshMotherBell();
}
